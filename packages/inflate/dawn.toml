schema = 1
# v2 of the package the repo spells `inflate`: a major bump renames the package
# (the v2-in-name rule), and consumers keep their `use inflate/...` lines by
# aliasing: `inflate = "../packages/inflate"` in compiler-plan. The v2 break
# folds each `_bounded` twin into its base function as a defaulted `cap`;
# the README has the table.
name = "inflate2"
version = "2.0.0"
