schema = 1
# The JVM server of the web framework, split out of packages/web at web 7: the
# one package of the framework with a `use java`, so that packages/web itself
# is pure Dawn and the native compiler can check, document and test it whole.
# Consumers write `web_jvm = { path = ... }` (or `[deps.web_jvm]` at a url) next
# to their `web` entry and `use web_jvm/server.{serve_app}`. This package's own
# `web` dependency must be the same web the application uses.
name = "web_jvm"
version = "1.0.0"

[deps]
web = "../web"
