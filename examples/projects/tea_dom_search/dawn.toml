# The site's search panel, as a reactor. It is the first application in this
# repository written for a page that already exists rather than for a demo
# frame: dawn-lang.dawnop.com mounts it from every page's header, and the
# index it searches is a build product of site/src/gen/search.dawn.
#
# Three things about it are why it is here and not only there. Its result list
# is built by nested collectors rather than by a fold over an accumulator; the
# collector that numbers the hits carries two state cells in one `with handle`;
# and the root and language every link at the bottom of the view needs arrive
# through a reader effect installed once at the top instead of as two extra
# parameters on every function in between.
#
# `json` is a direct dependency because the index is text the *application*
# parses -- `tea_dom` hands over the flags string and never looks inside it.
schema = 1
name = "tea_dom_search"
version = "1.0.0"

[deps]
tea_core = "../../../packages/tea-core"
tea_dom = "../../../packages/tea-dom"
json = "../../../packages/json"
