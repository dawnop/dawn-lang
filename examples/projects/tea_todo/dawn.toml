# A consumer of packages/tea-core and packages/tea-term, the same relationship
# the json example has to packages/json: the demo exercises the packages
# through [deps], it is not a second copy of them. Two deps rather than one
# since the split: the vocabulary-free half is a package of its own now, and
# an app names both because it uses both.
schema = 1
name = "tea_todo"
version = "1.0.0"

[deps]
tea_core = "../../../packages/tea-core"
tea_term = "../../../packages/tea-term"
