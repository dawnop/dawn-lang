# The smallest application whose initial model is not a constant: it is a
# function of what the page already knew. `tea_dom/reactor.serve_with_flags`
# is the entry point, and `flags` on the init line is the one string that
# reaches it.
#
# It exists for the gate rather than for the gallery. The counter and the two
# todos all start from a value, so nothing in the tree could tell a bridge
# that carries flags from one that drops them on the floor; the session
# scripts/example-main-contract pins for this project can, and
# scripts/wasm-dom-contract/flags.sh is what says so with mutants.
#
# `json` is a direct dependency because flags are text the *application*
# parses. The package hands over a string and looks inside it exactly never,
# so the decoder is here.
schema = 1
name = "tea_dom_flags"
version = "1.0.0"

[deps]
tea_core = "../../../packages/tea-core"
tea_dom = "../../../packages/tea-dom"
json = "../../../packages/json"
