# The host references layer 2 holds the device to. Its only dependency is std,
# and that is the point of the manifest: a reference that reached a kernel
# through packages/tileir would not be a second opinion. `[deps]` stays
# without `tileir`, and scripts/leetgpu-diff/check.py reads this file and
# fails when one appears.
schema = 1
name = "tileref"
version = "0.1.0"
