# The M4 acceptance artifact is a *consumer* of packages/json, not a second copy
# of it. It used to vendor lexer/parser/render/value under src/json/, and the two
# drifted: the package grew JInt and exact integer parsing while this copy kept
# routing every number through Float. README calls this directory the
# JSONTestSuite acceptance run, so the fork meant the suite was validating code
# that production never used.
schema = 1
name = "m4_json"
version = "1.0.0"

[deps]
json = "../../../packages/json"
