name: ci

# Why this exists: the site generator was broken for a whole milestone without
# anyone noticing — docs drifted past a hardcoded lint and nothing ever built the
# site on push. The compiler suite runs in seconds, so there is no reason not to.
#
# `branches:` on a push trigger matches branch pushes only, so `git push --tags`
# does not start a run here. This is therefore the only workflow that runs the
# gates, and a tag reads its verdict rather than asking for a second one.
#
# It used to ask. release.yml opened with its own `uses: ./.github/workflows/
# gates.yml`, so a release showed two complete gate runs at one sha (f96fd45 on
# 2026-08-07, and v0.76.0 at sha 21728208 thirteen minutes apart) and the note
# here defended them: a tag can point at any commit, including one this workflow
# never saw, so re-running the identical definition was the way to be sure it
# does not. The premise was right and the remedy was expensive, about 23,000
# job-seconds and 25 minutes per release to re-decide a decided sha. Since
# 2026-09-11 release.yml opens with a `verified` job instead, which asks the
# Actions API whether this workflow succeeded on that exact commit and refuses
# the tag otherwise. The two events are still two events; only the second one's
# 67 jobs are gone. gates.yml remains one file for the same reason as before:
# the release path is held to the identical gate set, and now it is held to the
# identical run.
on:
  push:
    branches: [main]
  pull_request:

# One run per ref. A second push while the first is still going supersedes it:
# the older run is testing a tree nobody will look at again, and on a 4-vCPU
# public runner it is also holding a slot the new one wants. The cost is that
# an intermediate commit on main can end without a verdict, which is the right
# trade here and the wrong one for a release — release.yml deliberately has no
# `concurrency` block, so a publishing run cannot be cancelled by anything.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Commit-message policy needs branch/PR event history, unlike the tree-only
  # repository policy in gates.yml. Keep that event-specific check here while
  # the reusable workflow inspects the checked-out tree.
  secrets:
    runs-on: ubuntu-latest
    # one git log scan; it has never taken more than a few seconds
    # budget: floor (seconds-scale job)
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 so the trailer check can see the pushed commit range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No Claude attribution in new commits. Suppressed at the Claude Code
      # settings source, but that is per-machine/per-session — a different machine
      # or an insistent system prompt slips it back in. commit-msg catches it
      # locally (opt-in hook), this catches it authoritatively. Such trailers once
      # had to be force-pushed out of history; this exists so that cannot recur.
      - name: no Claude attribution in commit messages
        run: |
          before='${{ github.event.before }}'
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ "$before" = 0000000000000000000000000000000000000000 ]; then
            range="HEAD~1..HEAD"
          elif git cat-file -e "$before^{commit}" 2>/dev/null; then
            range="$before..HEAD"
          else
            # A force-push orphans the previous tip, so `fetch-depth: 0` -- which
            # fetches what is *reachable* -- cannot fetch it, and a range against
            # it is not a revision at all. This step used to fail there rather
            # than check, which is precisely the operation the guard exists for:
            # the trailers it looks for were once removed by force-push. Scanning
            # the whole history instead is stricter and costs 0.04s for 500
            # commits.
            echo "note: $before is unreachable (force-push?) -- scanning all history"
            range="HEAD"
          fi
          python3 scripts/check-no-claude-trailer.py --range "$range"

  test:
    uses: ./.github/workflows/gates.yml
    secrets: inherit
