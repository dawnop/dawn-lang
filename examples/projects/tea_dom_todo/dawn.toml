# One tier above tea_dom_counter on the same bridge: a list whose length and
# whose contents both come from the model, an editor whose draft lives in the
# model, and a filter. It exists to be measured -- keyed pairing, local state,
# effect rows and the per-turn cost of an opaque model all show up here at a
# size the counter cannot reach.
#
# `json` is a direct dependency because the model is a record with a list in
# it: the counter could encode itself as one integer, and anything past that
# wants a real encoder rather than a hand-rolled separator scheme.
schema = 1
name = "tea_dom_todo"
version = "1.0.0"

[deps]
tea_core = "../../../packages/tea-core"
tea_dom = "../../../packages/tea-dom"
json = "../../../packages/json"
