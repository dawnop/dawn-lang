# The smallest whole application over packages/tea-core and packages/tea-dom:
# a model, three messages, `update`, `view`, and the text form the wire
# carries. It is what the site's demo page builds and shows, and what
# web/index.html loads, so it carries nothing a reader would have to skip.
# The fixtures the bridge gates need (a panicking message, a child list whose
# length varies, patch-level tests) live in
# examples/projects/tea_dom_counter_contract instead.
schema = 1
name = "tea_dom_counter"
version = "1.0.0"

[deps]
tea_core = "../../../packages/tea-core"
tea_dom = "../../../packages/tea-dom"
