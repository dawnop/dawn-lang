schema = 1
# The DOM half of the Elm architecture: a second vocabulary over the same
# reconciler contract the terminal consumes, plus the wire format and the
# reactor turn that carry a patch list across a wasm boundary. The
# vocabulary-free half is packages/tea-core; the terminal's is
# packages/tea-term, and nothing here depends on it.
name = "tea_dom"
version = "0.1.0"

[deps]
tea_core = "../tea-core"
json = "../json"
