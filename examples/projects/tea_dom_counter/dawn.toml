# A consumer of packages/tea-core and packages/tea-dom, the same relationship
# tea_todo has to tea-core and tea-term: the demo exercises the packages
# through [deps] rather than being a second copy of them. This one is the
# proof that the loop closes across a wasm boundary, so it is also what
# scripts/wasm-dom-contract builds and what examples/projects/tea_dom_counter/
# web/index.html loads in a browser.
schema = 1
name = "tea_dom_counter"
version = "1.0.0"

[deps]
tea_core = "../../../packages/tea-core"
tea_dom = "../../../packages/tea-dom"
