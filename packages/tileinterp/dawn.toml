# The interpreter executes what packages/tileir lowers, so tileir is its one
# dependency. packages/tileref is deliberately absent: the interpreter is
# held against tileref in CI (scripts/tileinterp-diff), and a reference the
# interpreter could call would make that comparison agree with itself.
schema = 1
name = "tileinterp"
version = "0.2.1"

[deps]
tileir = "../tileir"
