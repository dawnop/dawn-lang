name: release

# Why this exists: dawnop-site runs its production backend on code this compiler
# builds, and a tag is only pinnable if it ships an artifact — pushing `v*`
# publishes dawn-selfhost.jar, which is also the next bootstrap seed
# (docs/bootstrap.md, 种子推进协议). The Kotlin implementation is archived at
# the kotlin-final tag; releases before v0.8.0 shipped its dawn.jar too.
#
# Since K-B7 it also publishes dawnc-linux-x86_64, the native compiler as a
# single static executable. That one is additive and nothing bootstraps from
# it: its .sha256 is download integrity, not a seed checksum — the only file
# scripts/seedjar.sh ever verifies against scripts/seed-checksums.txt is the
# jar.
#
# Releasing is: bump VERSION in selfhost/src/version.dawn, commit, then
#   git tag v0.9.0 && git push --tags
on:
  push:
    tags: ['v*']

# No `concurrency` block, deliberately: ci.yml has one so that a superseded
# push stops burning a runner, and the same setting here would let a second tag
# cancel a run that is part-way through publishing a release.

permissions:
  contents: write # create the release and upload the jar

jobs:
  # The same gate list ci.yml runs, not a hand-copied subset. A tag can point at
  # any commit — including one main CI never saw — which is precisely why this
  # has to be the *identical* definition rather than a shorter one that says it
  # is re-running the suite.
  gates:
    uses: ./.github/workflows/gates.yml
    secrets: inherit

  release:
    needs: gates
    runs-on: ubuntu-latest
    # three jar builds plus the native image; no gate here, so the estimate is
    # the fixpoint chain's share of the test job (~13 min) with room over it
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Seed consecration: every release jar is the next bootstrap seed, so
      # the tag itself must pass the self-hosting gates — ci.yml runs them on
      # main, but a tag can point anywhere. The chain is seed → A → B → C:
      # the published jar is B (HEAD compiled by HEAD), proven by cmp B C.
      - name: build the toolchain chain from the seed
        run: |
          . scripts/seedjar.sh
          ROOT=$(pwd)
          SEED="$(seed_jar)"
          # The seed builds A against its own released std (it may not be able
          # to check today's std/ — see seedjar.sh seed_std_dir); B and C use
          # today's std. This inline chain is a second copy of the one in
          # scripts/selfhost-fixpoint.sh — keep them in step.
          SEED_V="--std $(seed_std_dir) --vendor org/objectweb/asm --vendor coursierapi"
          V="--std std --vendor org/objectweb/asm --vendor coursierapi"
          java -Xss512m -jar "$SEED" build selfhost -o a.jar $SEED_V
          java -Xss512m -jar a.jar build selfhost -o dawn-selfhost.jar $V
          java -Xss512m -jar dawn-selfhost.jar build selfhost -o c.jar $V
          cmp dawn-selfhost.jar c.jar
          echo "closure OK (B == C)"

      # The tag is what consumers pin, so it must name what is in the jar
      # (VERSION in selfhost/src/version.dawn).
      - name: the jar reports the version we think it does
        run: |
          OUT=$(java -Xss512m -jar dawn-selfhost.jar --version)
          echo "$OUT"
          case "$OUT" in
            "dawn ${GITHUB_REF_NAME#v} ("*) ;;
            *) echo "::error::--version said '$OUT' (bump selfhost/src/version.dawn)"; exit 1 ;;
          esac

      # K-B7: a second artifact, for consumers who would rather not install a
      # JVM. It is *additive* — the bootstrap seed is still the jar
      # (scripts/seed-release.txt, seedjar.sh), nothing reads this binary, and
      # scripts/seed-checksums.txt is untouched. Built from the jar published
      # above, so it is that jar's own output; scripts/release-native.sh is the
      # same script gates.yml runs on every push, and its header says what each
      # of its four checks catches that the previous one does not.
      - name: the native binary
        run: |
          ./scripts/release-native.sh -o dawnc-linux-x86_64 \
            --jar dawn-selfhost.jar --expect "${GITHUB_REF_NAME#v}"

      # Every release jar is the next repo's bootstrap seed, and seedjar.sh
      # verifies each seed against scripts/seed-checksums.txt before using it.
      # Publishing the digest next to the jar is what lets the *next* bump fill
      # that file in from the release rather than from whatever happens to be in
      # someone's local cache.
      - name: checksum
        run: |
          sha256sum dawn-selfhost.jar | tee dawn-selfhost.jar.sha256
          echo "::notice::add this line to scripts/seed-checksums.txt when bumping the seed:"
          echo "::notice::$(cut -d' ' -f1 dawn-selfhost.jar.sha256)  $GITHUB_REF_NAME"
          # The seed's other half. stage 1 is "this jar + the std this tag
          # shipped", and seedjar.sh verifies both before using either, so a
          # bump needs two lines and not one. The tree hash is computed from
          # the checkout, which is this tag.
          . scripts/seedjar.sh
          ROOT=$(pwd)
          echo "::notice::add this line to scripts/seed-std-checksums.txt at the same time:"
          echo "::notice::$(seed_tree_sha std)  $GITHUB_REF_NAME"

      # gh is preinstalled on runners — no third-party action in the release path.
      #
      # Every asset is named, never globbed: a glob that matches nothing
      # publishes a release with one file missing and says nothing about it,
      # while a named file that is absent fails the step. The binary's own
      # existence check (release-native.sh) is the first line; this is the
      # second.
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dawn-selfhost.jar \
            dawn-selfhost.jar.sha256 \
            dawnc-linux-x86_64 \
            dawnc-linux-x86_64.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
