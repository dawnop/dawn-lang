  tile-before-11:
    needs: dedupe
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    # 2026-10-19 (#274), eleven shards dealt by cost: 19 kernels and 8 mutants;
    # 602s on the median runner and 676s on the worst of the 64 main jobs
    # replayed, one deviation 89s. The claim is that worst plus the deviation,
    # rounded up to 5s, a planning value until three runs of the eleven are
    # observed. The note above has the arithmetic.
    #
    # 2026-10-20 (tileinterp I1): plus the interpreter-against-tileref step
    # below, 20s on the recording machine (build 5s, 24 families 15s) and
    # charged at twice that for the slow runner plus a tenth, 45s, the
    # dearest shard staying the 785s one. Shard 11 is the one with the most room.
    #
    # 2026-10-20 (tileinterp I2): the interpreter now runs matrix products,
    # narrow formats and fma, and the architecture-gated family too: 42s on
    # the recording machine (build 5s, 25 families 37s), charged the same way
    # at 95s, 50s more than I1's 45s, and shard 11 stays under the 950s pole.
    # budget: 3x 860s planning value: replayed worst plus one deviation, plus 95s of interpreter run
    timeout-minutes: 43
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: initialize successful work clocks
        run: |
          echo "MUTANT_COVERAGE_DIR=$RUNNER_TEMP/mutant-coverage" >> "$GITHUB_ENV"
          echo "ITEM_TIMES=$RUNNER_TEMP/ITEM_TIMES.txt" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: restore the pinned tileiras wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/tileiras-wheels
          key: tileiras-wheels-v1-${{ runner.os }}-${{ hashFiles('scripts/tile-golden/toolchain.txt') }}

      - name: the pinned tileiras
        run: |
          started=$SECONDS
          bin="$(./scripts/tile-golden/install-tileiras.sh "$RUNNER_TEMP/tileiras" "$RUNNER_TEMP/tileiras-wheels")"
          "$bin" --version
          echo "TILEIRAS=$bin" >>"$GITHUB_ENV"
          echo "Pinned assembler installation: $((SECONDS - started))s (wheel cache status is reported above)." >>"$GITHUB_STEP_SUMMARY"

      - name: tile IR goldens and tileiras (208 kernels and ninety-three mutants, both backends; shard 11 of 11)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/tile-golden/run.sh --shard 11/11 --plan scripts/tile-prep/baseline-plan.txt

      # Layer 2 without a device (docs/tileinterp-design.md 3): every
      # tile-gpu-diff family with packages/tileinterp in the device's chair,
      # judged against packages/tileref by the same corpora and tiers, and the
      # covered kernels held to scripts/tileinterp-diff/covered.txt. It needs
      # no tileiras; it sits in this shard for the budget, not the toolchain.
      - name: the interpreter against tileref (every layer-2 family, no GPU)
        run: ./scripts/tileinterp-diff/run.sh

      - name: record successful work and item clocks
        id: receipt
        run: python3 -B scripts/tile-prep/coverage.py receipt --baseline --index 11 --total 11 --plan scripts/tile-prep/baseline-plan.txt

      - name: record which items this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-tile-golden-11
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1


  baseline-complete:
    needs: [dedupe, tile-before-1, tile-before-2, tile-before-3, tile-before-4, tile-before-5, tile-before-6, tile-before-7, tile-before-8, tile-before-9, tile-before-10, tile-before-11]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    # budget: floor (lightweight receipt and coverage union)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: coverage identities and missing work are refused
        run: python3 -B scripts/tile-prep/coverage.py selftest
      - name: the union is every successful item exactly once
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/tile-prep/coverage.py union --total 11 --job-prefix tile-before- --baseline --plan scripts/tile-prep/baseline-plan.txt --out "$RUNNER_TEMP/tile-evidence"
      - name: retain receipts and successful item clocks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tile-before-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tile-evidence
          if-no-files-found: error
          retention-days: 7
