# The todo list with its rows keyed, and the application the public demo on
# dawn-lang.dawnop.com mounts.
#
# It is a sibling of tea_dom_todo rather than an edit to it because the two
# exist for opposite reasons. That one is deliberately unkeyed and must stay
# that way: scripts/wasm-dom-contract measures what index pairing costs, and a
# measurement has to have something to measure. This one is what a person
# clicks, and a person editing row 3 while row 1 is deleted keeps their caret
# only if the reconciler pairs by key -- so the demo pairs by key, and the
# contract keeps its subject.
#
# One line of todo.dawn differs: `el("ul", ...)` becomes `keyed("ul", ...)`
# with each row named by its id. Everything else is the same application.
#
# `json` is a direct dependency because the model is a record with a list in
# it: the counter could encode itself as one integer, and anything past that
# wants a real encoder rather than a hand-rolled separator scheme.
schema = 1
name = "tea_dom_todo_keyed"
version = "1.0.0"

[deps]
tea_core = "../../../packages/tea-core"
tea_dom = "../../../packages/tea-dom"
json = "../../../packages/json"
