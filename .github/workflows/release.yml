name: release

# Why this exists: dawnop-site runs its production backend on code this compiler
# builds, and a tag is only pinnable if it ships an artifact — pushing `v*`
# publishes dawn-selfhost.jar, which is also the next bootstrap seed
# (docs/bootstrap.md, 种子推进协议). The Kotlin implementation is archived at
# the kotlin-final tag; releases before v0.8.0 shipped its dawn.jar too.
#
# Since K-B7 it also publishes dawnc-linux-x86_64, the native compiler as a
# single static executable. That one is additive and nothing bootstraps from
# it: its .sha256 is download integrity, not a seed checksum — the only file
# scripts/seedjar.sh ever verifies against scripts/seed-checksums.txt is the
# jar.
#
# Releasing is: bump VERSION in selfhost/src/version.dawn, commit, push main,
# wait for main CI, then create and push exactly one tag:
#   git push origin main
#   git tag v0.9.0
#   git push origin refs/tags/v0.9.0
# Never use `git push --tags`; it can publish unrelated local tags.
#
# What this workflow no longer does is run the gates. Until 2026-09-11 its first
# job was `uses: ./.github/workflows/gates.yml`, the same 67-job suite ci.yml had
# already run on the same commit minutes earlier (v0.76.0 sha 21728208: ci run
# 33807243516 at 21:18Z, release run 33808399893 at 21:31Z). The reason was that
# a tag can point at any commit, and re-running the whole suite was the cheapest
# way to be certain it does not. It was not cheap: about 23,000 job-seconds and
# 25 minutes of wall clock per release, spent re-deciding a question already
# decided. The `verified` job below buys the same certainty with a few API
# queries, by requiring what the procedure above already requires. gates.yml is still the
# single definition of the gate set, and a tag is still held to it; what stopped
# is running it twice over one sha.
on:
  push:
    tags: ['v*']

# No `concurrency` block, deliberately: ci.yml has one so that a superseded
# push stops burning a runner, and the same setting here would let a second tag
# cancel a run that is part-way through publishing a release.

permissions:
  contents: write # create the release and upload the jar
  actions: read # the guard below reads ci.yml's and verify-external.yml's runs
  statuses: read # and the gates/maintainer commit status

jobs:
  # The release procedure at the top of this file is now enforced by machine
  # rather than by memory: the tagged commit must already carry evidence that
  # gates.yml passed on it. So a tag pointing at a commit nobody verified is
  # still refused, which was the whole point of the duplicate suite this
  # replaced; it is refused in seconds instead of after re-deciding 67 jobs.
  #
  # Since 2026-09-24 there are two kinds of evidence and either is enough
  # (scripts/gates-external/release_evidence.py, whose header has every
  # check and the reason for it):
  #
  #   1. a successful ci.yml run at this sha triggered by a push to the
  #      default branch. Since the two-tier CI (#168, 2026-09-23) that is the
  #      only ci.yml run that is the whole gate set: a pull_request run is the
  #      subset plan.py picked, its other jobs skipped and counted as success,
  #      and the API files it under the same head sha. Runs of any other event
  #      or branch are printed with the reason they were refused. Since
  #      2026-09-25 a push run on main can skip every gate as well (the plan
  #      job's evidence tier), so the run's jobs are read back and a run
  #      with a skipped job is refused too. A run still in progress is not waited for: a guard that polled would hold a
  #      runner for the length of the suite to learn what a re-run learns for
  #      free.
  #
  #   2. a `gates/maintainer` commit status of success, written by
  #      verify-external.yml on the default branch in a run that succeeded:
  #      the maintainer's signed external run of the full gate set
  #      (docs/bootstrap.md). A status alone is not accepted, since anyone
  #      with write access can post one; the script reads the run its
  #      target_url names back from this repository's API and holds it to
  #      the workflow file, the event, the branch, the conclusion and the
  #      time the status was written.
  #
  # Neither holding fails the job and prints what each check found. The
  # script's --selftest runs first (milliseconds): fourteen fabricated API
  # answers, including a pull request run, a status pointing at another
  # repository and one pointing at another workflow, each of which must get the verdict it is listed with. The
  # script is checked out at the tag, as this workflow file is: a tag's
  # commit could already edit this job, so reading the script from it adds
  # no way around the guard that was not there before.
  #
  # Pagination is not a case for either query: `head_sha` filters runs
  # server-side and a commit's statuses are one short list, and the script
  # reads every page `gh api --paginate` returns regardless.
  verified:
    runs-on: ubuntu-latest
    # budget: floor (seconds-scale job; a checkout and three Actions API queries, no toolchain)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: the gates have passed on this commit (ci.yml, or signed external evidence)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 scripts/gates-external/release_evidence.py --selftest
          python3 scripts/gates-external/release_evidence.py \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --default-branch "$DEFAULT_BRANCH" --server "$GITHUB_SERVER_URL" \
            || { status=$?; echo "re-run once the evidence exists: gh run rerun $GITHUB_RUN_ID"; exit $status; }

  release-jar:
    needs: verified
    name: release JAR (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '26']
    # Each matrix leg runs the full seed → A → B → C builder. Keeping the
    # invocation here once makes the source-level recipe singular while the
    # matrix proves that both supported JDKs produce the same final B.
    # budget: 3x 44s worst observed
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      # Seed consecration: every release jar is the next bootstrap seed, so
      # the tag itself must pass the self-hosting gates, which is what the
      # `verified` job above establishes on this exact sha. The canonical
      # builder owns the seed → A → B → C chain and atomically promotes the
      # verified B.
      - name: build the toolchain chain from the seed
        run: ./scripts/build-release-jar.sh -o dawn-selfhost.jar

      - name: retain the JDK candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-jar-jdk-${{ matrix.java-version }}
          path: dawn-selfhost.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: release-jar
    runs-on: ubuntu-latest
    # budget: 3x 137s worst observed
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: download the JDK 21 candidate
        uses: actions/download-artifact@v4
        with:
          name: release-jar-jdk-21
          path: release-candidates/jdk-21

      - name: download the JDK 26 candidate
        uses: actions/download-artifact@v4
        with:
          name: release-jar-jdk-26
          path: release-candidates/jdk-26

      # Neither native compilation nor release creation may see a jar until
      # the two independently fixed-pointed candidates compare byte for byte.
      # JDK 21 is the explicit publication candidate; equality makes the choice
      # semantically immaterial while keeping provenance unambiguous.
      - name: compare JDK candidates and select the release JAR
        run: |
          JDK21_JAR=release-candidates/jdk-21/dawn-selfhost.jar
          JDK26_JAR=release-candidates/jdk-26/dawn-selfhost.jar
          test -f "$JDK21_JAR"
          test -f "$JDK26_JAR"
          cmp "$JDK21_JAR" "$JDK26_JAR"
          cp "$JDK21_JAR" dawn-selfhost.jar
          cmp "$JDK21_JAR" dawn-selfhost.jar

      # The tag is what consumers pin, so it must name what is in the jar
      # (VERSION in selfhost/src/version.dawn).
      - name: the jar reports the version we think it does
        run: |
          mapfile -t SOURCE_VERSIONS < <(
            sed -nE 's/^pub const VERSION: String = "([^"]+)"$/\1/p' \
              selfhost/src/version.dawn
          )
          if [ "${#SOURCE_VERSIONS[@]}" -ne 1 ]; then
            echo "::error::selfhost/src/version.dawn must declare exactly one VERSION"
            exit 1
          fi
          VERSION="${SOURCE_VERSIONS[0]}"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not exactly name source version '$VERSION'"
            exit 1
          fi
          OUT=$(java -Xss512m -jar dawn-selfhost.jar --version)
          echo "$OUT"
          if [ "$OUT" != "dawn $VERSION (selfhost)" ]; then
            echo "::error::--version said '$OUT', expected 'dawn $VERSION (selfhost)'"
            exit 1
          fi

      # K-B7: a second artifact, for consumers who would rather not install a
      # JVM. It is *additive* — the bootstrap seed is still the jar
      # (scripts/seed-release.txt, seedjar.sh), nothing reads this binary, and
      # scripts/seed-checksums.txt is untouched. Built from the jar published
      # above, so it is that jar's own output; scripts/release-native.sh is the
      # same script gates.yml runs on every push, and its header says what each
      # of its four checks catches that the previous one does not.
      - name: the native binary
        run: |
          ./scripts/release-native.sh -o dawnc-linux-x86_64 \
            --jar dawn-selfhost.jar --expect "${GITHUB_REF_NAME#v}"

      # The public API surface of this tag, and its diff against the previous
      # release's (issue #29). A report, not a gate: nothing here fails the
      # release, and no version number is policed. Consumers pin bytes by
      # content hash, so a semver check would protect a convention the machine
      # does not read. What the report carries that nothing else does is the
      # effect row: a unit that started doing IO cannot do it quietly, and the
      # diff names the expansion.
      #
      # Built with the jar published above rather than with ./bin/dawn, which
      # would rebuild the whole toolchain from the seed to answer a question
      # this jar already answers. Measured cost: ~8s for the snapshot over the
      # stdlib and eight packages, under a second for the diff.
      #
      # "No previous snapshot" is a success path, not a failure: the first
      # release carrying these assets has nothing to compare against, and the
      # publish step below requires the report to exist either way. The
      # download's failure is not distinguished from the asset's absence,
      # deliberately: this is a report, and a report is not worth failing a
      # release over.
      - name: the pub-API snapshot and its diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/api-diff.py --self-test
          python3 scripts/api-snapshot.py \
            --dawn "java -Xss512m -jar $PWD/dawn-selfhost.jar" \
            -o dawn-pub-api.json
          PREVIOUS=$(
            gh release list --limit 30 --json tagName --jq '.[].tagName' \
              | grep -vFx "$GITHUB_REF_NAME" | head -n 1 || true
          )
          if [ -n "$PREVIOUS" ] && gh release download "$PREVIOUS" \
              --pattern dawn-pub-api.json --dir previous; then
            echo "pub-API diff against $PREVIOUS"
            python3 scripts/api-diff.py previous/dawn-pub-api.json \
              dawn-pub-api.json -o dawn-pub-api-diff.md
          else
            echo "no previous pub-API snapshot; reporting this surface alone"
            python3 scripts/api-diff.py dawn-pub-api.json -o dawn-pub-api-diff.md
          fi

      # Publish the digest beside the jar. advance-seed.sh later downloads and
      # rechecks both instead of trusting a local build or cache.
      - name: checksum
        run: |
          sha256sum dawn-selfhost.jar | tee dawn-selfhost.jar.sha256

      # A run can stop after creating the release or after uploading only some
      # assets. Re-running must converge rather than fail on existing state:
      # create only when absent, replace every named asset, then query GitHub
      # and require each contract name exactly once. Historical extra assets
      # are tolerated, but none of the current assets may be omitted.
      #
      # Two lists because they answer to different documents, and
      # scripts/doc-check.py holds both ends. INSTALL_ASSETS is what the
      # README download blocks fetch, compared name for name in both
      # directions. REPORT_ASSETS is published beside them and deliberately
      # not fetched by any install step: they describe a release rather than
      # being one, and putting them in the install block would tell a reader
      # to download a Markdown file to run `hello.dawn`. They are named in the
      # README all the same, because an asset no document mentions is an asset
      # nobody knows to look for.
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INSTALL_ASSETS=(
            dawn-selfhost.jar
            dawn-selfhost.jar.sha256
            dawnc-linux-x86_64
            dawnc-linux-x86_64.sha256
          )
          REPORT_ASSETS=(
            dawn-pub-api.json
            dawn-pub-api-diff.md
          )
          EXPECTED_ASSETS=("${INSTALL_ASSETS[@]}" "${REPORT_ASSETS[@]}")
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber "${EXPECTED_ASSETS[@]}"

          mapfile -t PUBLISHED_ASSETS < <(
            gh release view "$GITHUB_REF_NAME" --json assets \
              --jq '.assets[].name'
          )
          for EXPECTED in "${EXPECTED_ASSETS[@]}"; do
            COUNT=0
            for PUBLISHED in "${PUBLISHED_ASSETS[@]}"; do
              if [ "$PUBLISHED" = "$EXPECTED" ]; then
                COUNT=$((COUNT + 1))
              fi
            done
            if [ "$COUNT" -ne 1 ]; then
              echo "::error::release asset '$EXPECTED' appears $COUNT times; expected exactly once"
              exit 1
            fi
          done

      - name: report the seed-advance command
        run: echo "::notice::./scripts/advance-seed.sh $GITHUB_REF_NAME"
