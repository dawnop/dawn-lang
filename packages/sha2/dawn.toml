schema = 1
# v2 of the package the repo spells `sha2`, and the only one of these whose name
# does not move: the v2-in-name rule asks a major >= 2 to end in its major, and
# the `2` already there is the algorithm family (SHA-2). The two agree by
# coincidence at major 2. A major 3 would put them in conflict, and that is a
# decision to take then rather than a name to guess now.
name = "sha2"
version = "2.0.0"
