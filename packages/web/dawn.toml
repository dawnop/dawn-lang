schema = 1
# v4 of the package the repo spells `web`: a major bump renames the package
# (the v2-in-name rule), and consumers keep their `use web/...` lines by
# aliasing — `web = { path = ... }` here, `[deps.web]` at a url downstream.
# The v4 break: Request.body is the wire Bytes (the old lossy String field is
# gone, `raw` renamed onto it) and the UTF-8 view is `body_text`, which is a
# 400 on a malformed body.
name = "web4"
version = "4.0.0"

[deps]
json = "../json"
