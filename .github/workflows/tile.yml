        run: python3 -B scripts/tile-prep/full.py consume
      - name: tile goldens and mutants on both backends, shard 2 of 19
        run: ./scripts/tile-golden/run.sh --prebuilt "$RUNNER_TEMP/execution-closure/native" --tileiras "$TILEIRAS" --shard 2/19 --plan scripts/mutant-coverage/plans/tile-golden.txt
      - name: record successful work and item clocks
