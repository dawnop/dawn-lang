schema = 1
# v9 of the package the repo spells `web`: a major bump renames the package
# (the v2-in-name rule), and consumers keep their `use web/...` lines by
# aliasing — `web = { path = ... }` here, `[deps.web]` at a url downstream.
# The v5 break narrows the public surface: `Response` and `ServerHandle` are
# opaque (read through accessors), the router's dispatch seam is package-private,
# `serve_app_bounded` is gone, and a body limit is a positive number or a startup
# panic. docs/web5-design.md has the list and the reasons.
# v6 folds three function pairs into one function each with a trailing
# defaulted parameter (`fmt`, `length`) and removes the suffixed halves
# (docs/std-defaults-design.md, K4); the README's 6.0 section has the mapping.
# 6.1 narrows header values to ASCII and closes the exchange on a JVM Error;
# a minor, as 3.1 and 3.2 were: README "Header values are ASCII (6.1)".
# v7 makes the package pure Dawn: the JVM server moved to packages/web-jvm, so
# the native compiler can check, document and test this package whole;
# `streaming` takes a `BodySource` instead of an `InputStream`, and the
# server's entry points moved with it. docs/web-core-split-design.md has the
# list and the reasons; CHANGELOG 7.0.0 has the mapping.
# 7.1 adds web/exchange, a pure-Dawn single-exchange server (one HTTP/1.1
# request in, one response out, over a Transport), and the decisions it shares
# with web_jvm/server as public functions; `with_logging_to_stderr` for a
# program whose stdout is the response. Additions only, so a minor.
# 7.2 adds `stdio_transport` (the Transport of a process with the connection as
# stdin and stdout) and makes a "stream-body" upload stream to disk in pieces on
# that server instead of passing through memory whole. Additions only.
# v8 requires BodySource.read(pos, n); both pumps own the offset.
# v9 adds caller-defaulted Loc to the refusing response constructors. Direct
# calls may omit it; function values gain a parameter, so this is a major.
name = "web9"
version = "9.0.0"

[deps]
json = "../json"
