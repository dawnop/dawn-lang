# nginx snippet for the Playground API. Fold into the existing
# `server { server_name dawn-lang.dawnop.com; ... }` block (the static site is
# already served there; this adds the dynamic Playground endpoints).
#
# Everything hard — TLS, HTTP/2, gzip — stays in nginx; the Dawn runner only
# speaks plain HTTP/1.1 on 127.0.0.1:8087.

# Rate-limit zones (declare once, in the http{} block, not here):
#   limit_req_zone $binary_remote_addr zone=playrun:10m rate=12r/m;
#   limit_req_zone $binary_remote_addr zone=playcheck:10m rate=60r/m;
#   limit_req_zone $binary_remote_addr zone=playcompile:10m rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=playlsp:10m rate=6r/m;
#   limit_conn_zone $binary_remote_addr zone=playlsp_conn:10m;
#
# CORS: when the site page calls this API on another host
# (the live setup uses a dedicated play host), the REST locations below
# answer the one site origin and nobody else. Declare the allow-list map once, in the http{} block:
#   map $http_origin $play_cors {
#       default "";
#       "https://dawn-lang.dawnop.com" $http_origin;
#   }
# An empty value makes add_header send nothing, so other origins get no
# CORS headers. `always` is deliberate: 413/429 replies must carry them too,
# or the browser reports a bare network error. Each REST location repeats the
# headers because add_header is not inherited once a location sets its own,
# and the preflight `if` block replaces the location-level ones.
# /api/lsp is a WebSocket upgrade: no CORS headers, the gateway checks Origin
# itself.

location = /api/run {
    # Preflight for the site's pages; the body is never read.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $play_cors always;
        add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 600 always;
        add_header Vary Origin always;
        return 204;
    }
    add_header Access-Control-Allow-Origin $play_cors always;
    add_header Vary Origin always;
    limit_req zone=playrun burst=4 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8087/run;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # a compile+run can take a few seconds; allow for it but not forever
    proxy_read_timeout 30s;
    client_max_body_size 128k;   # the runner also caps at 64k; reject earlier
}

# Editor diagnostics: compile-only, fired on typing pauses, so the budget is
# looser than /run (~1/s sustained) but the timeout tighter (no program runs).
location = /api/check {
    # Preflight for the site's pages; the body is never read.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $play_cors always;
        add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 600 always;
        add_header Vary Origin always;
        return 204;
    }
    add_header Access-Control-Allow-Origin $play_cors always;
    add_header Vary Origin always;
    limit_req zone=playcheck burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8087/check;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 15s;
    client_max_body_size 128k;
}

# Compile view (C / JVM listing). A cold request runs two compilers and javap
# under one runner permit (about 6 s measured on the production host), so the
# sustained rate is half of /check's. The 30r/m and burst=6 are PROVISIONAL
# estimates: tighten or loosen them after a week of access-log data.
location = /api/compile {
    # Preflight for the site's pages; the body is never read.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $play_cors always;
        add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 600 always;
        add_header Vary Origin always;
        return 204;
    }
    add_header Access-Control-Allow-Origin $play_cors always;
    add_header Vary Origin always;
    limit_req zone=playcompile burst=6 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8087/compile;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 30s;
    client_max_body_size 128k;
}

# One WebSocket maps to one native dawnc process.  nginx limits churn and
# per-address fan-out; the loopback gateway independently enforces a global
# two-session ceiling before it starts a child.
location = /api/lsp {
    limit_req zone=playlsp burst=2 nodelay;
    limit_req_status 429;
    limit_conn playlsp_conn 2;
    limit_conn_status 429;

    proxy_pass http://127.0.0.1:8088/lsp;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

    proxy_connect_timeout 2s;
    # The gateway pings every 30 seconds, so a live connection cannot hit this.
    proxy_read_timeout 75s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 1k;  # upgrade requests must not carry a body
}

location = /api/health {
    # Preflight for the site's pages; the body is never read.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $play_cors always;
        add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 600 always;
        add_header Vary Origin always;
        return 204;
    }
    add_header Access-Control-Allow-Origin $play_cors always;
    add_header Vary Origin always;
    proxy_pass http://127.0.0.1:8087/health;
    access_log off;
}
