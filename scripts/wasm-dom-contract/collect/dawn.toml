schema = 1
# Not a package and not an example: a gate fixture that consumes both DOM
# packages so a collector written with handler state cells can be held to the
# three things a transcript cannot see. Discovery gates look under packages/
# and examples/, so nothing picks this up by accident; ../collect.sh is the
# only thing that runs it.
name = "tea_dom_collect_oracle"
version = "0.0.0"

[deps]
tea_core = "../../../packages/tea-core"
tea_dom = "../../../packages/tea-dom"
