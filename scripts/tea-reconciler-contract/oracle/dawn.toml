schema = 1
# Not a package and not an example: a gate fixture that consumes both tea
# packages so the pre-split reconciler (src/oldiff.dawn) and the shipped one can
# be run over the same corpus and compared. Discovery gates look under
# packages/ and examples/, so nothing picks this up by accident;
# ../run.sh is the only thing that runs it.
name = "tea_reconciler_oracle"
version = "0.0.0"

[deps]
tea_core = "../../../packages/tea-core"
tea_term = "../../../packages/tea-term"
