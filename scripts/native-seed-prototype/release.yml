# Isolated protocol sketch, deliberately outside .github/workflows.
# The producer consumes a verified qualification package; it never rebuilds B.
# JVM 21/26 remain separate oracle products. Publishing here means local storage.
name: native-schema2-prototype
on: workflow_dispatch
jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - name: produce identities from explicit qualification
        run: bash scripts/native-seed-prototype/release-native.sh --package "$PACKAGE" --out "$STAGING"
      - name: verify same-commit aggregation and immutable local assets
        run: python3 scripts/native-seed-prototype/rehearse.py publish --from-dir "$STAGING" --store "$STORE" --tag "$TAG"
