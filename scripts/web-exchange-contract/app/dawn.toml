schema = 1
# The one application both sides of scripts/web-exchange-contract serve: a
# route table and a middleware list, written once so that a difference between
# the JVM server and the single-exchange adapter cannot hide in a fixture that
# was written twice. It depends on `web` only; each side's main brings its own
# server (web_jvm/server or web/exchange).
name = "contract_app"
version = "1.0.0"

[deps]
web = "../../../packages/web"
