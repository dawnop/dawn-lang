name: gates

# The single definition of "this commit passes".
#
# Why it is its own file: ci.yml ran the full suite on main, release.yml ran a
# hand-copied subset on a tag — selfhost tests and site tests, and nothing
# else. A tag can point at any commit, which is exactly why release.yml said
# it re-ran the suite; what it actually re-ran skipped packages, playground,
# every contract, the native differential and formatting. Two hand-maintained
# lists of the same gates drift, and this one already had.
#
# So the gates live here once and both callers `uses:` this file. Adding a
# gate in one place now adds it everywhere, which is the only arrangement
# that stays true. (The audit-fixes branch proposed this shape on 2026-07-25;
# the content below is the gate set as of the merge, not that snapshot.)
#
# The gates are spread over independent jobs rather than run in one. That is
# scheduling and nothing else — no gate was dropped, weakened or made
# conditional, and a job boundary is drawn only where the steps on either side
# share nothing but the toolchain. The first split (2026-08-07) took the three
# steps that were 70% of one job's wall clock and gave each its own; the second
# (2026-08-10) finished the job. `test` was still carrying 43 gates and was
# still the whole critical path — 731s of a 731s run (31353623211) while five
# jobs sat under six minutes — so its steps were dealt out to the jobs already
# paying for the same toolchain, plus one new job (`contracts`) for the
# emit/std contract block. The third (2026-08-20, #299) sharded the two mutant
# matrices that had become the wall clock — the syntax family out of
# checker-corpus, builtin-type out of docs — and moved the classfile Never
# block out of contracts.
#
# No job that gates the tree may `needs:` another: they all start at once, and
# the run is as long as the longest one. The one `needs:` in this file is
# mutant-shards-complete, which is not a gate about the tree but about this
# run's own completeness — it reassembles what the mutant shards recorded and
# holds the union to the matrices, so it cannot start before them and sits off
# the critical path (the shards it waits on are shorter than native-diff).
#
# Job definition order is descending expected duration, because runs here
# regularly hold more jobs than the account's concurrent-runner ceiling (20;
# the arithmetic lives in dawnop-site's ci.yml, measured 2026-08-15) and
# creation order roughly tracks definition order: the jobs that queue should
# be the short tail, which fits in slots the first finishers free. That is a
# soft nudge, not a contract — GitHub does not promise dispatch order. A run
# of this workflow holds 36 jobs (2026-09-04, tile-golden's third shard), and
# ci.yml adds its own `secrets`, so 37 against the ceiling of 20: the second
# wave starts as the first finishes, which is why the four native-diff shards
# are defined first. The 36th job does not lengthen the run: with 36 already
# queuing against 20 runners the span is set by the tail, not by the count.
#
# The setup they each repeat is ~40s and comes out of
# .github/actions/dawn-toolchain, which exists so that the copies cannot drift.
#
# The run's wall clock is its longest job, and the 3x budget rule already
# forces every job's worst observation into its own budget line -- so the line
# below caps what any of those lines may claim, and the #299 speedup is held
# by check-gate-budgets.py instead of by memory. A job that regresses past the
# pole must restate its budget, the restatement collides with the pole, and
# raising the pole is a visible, reviewable edit rather than a silent slide.
# 660s = native-diff's historical worst (589s, in export-surface's note) with
# headroom for its documented non-reproducibility. This pins the per-job
# claims, not the literal run wall clock: queueing and the coverage guard's
# tail are outside it, and a checker cannot read a future run.
#
# 2026-09-03: the pole held, and it held by being enforced. native-diff had
# reached 1119s and contracts 759s, both of which would have had to claim
# past 660s -- so both were split instead (four shards and two halves), which
# is the move the pole exists to force. The tallest claim in this file is now
# builtin-type-1's 557s, and the highest of the new planning values is 413s.
# The pole did not move and no job asked it to.
#
# 2026-09-04: the std pruning knife (e797abb0) dropped the unreachable half
# of std per program, and every job that compiles a program got cheaper: the
# native-diff shards ran 195/140/166/126s on the pruned tree against
# 360/288/217/286s on its parent, and the run's span went 883s to 715s. None
# of those lines is restated downwards here. A claim is a claim about the
# worst run in the observation window, pre-prune runs are still in that
# window, and check-gate-budgets.py --observed refuses a claim under its
# maximum; the nine lines restated below all went the other way. The tallest
# claim in this file is still builtin-type-1's 557s, whose own worst
# observation is now 521s, and the highest remaining planning value is
# native-diff-1's 391s.
#
# What the pole cannot see is a claim that has quietly stopped being true:
# check-gate-budgets.py compares the timeout with the claim and the claim with
# the pole, and both numbers live in this file. On 2026-09-03 twenty-one lines
# here were under their job's own worst run and every gate was green. The
# audit that reads the other side is manual, because it needs the Actions API
# and a token, and it is expected before a budget line is restated:
#
#   scripts/gate-observations.py --since <ISO> --out /tmp/obs.json
#   scripts/check-gate-budgets.py --observed /tmp/obs.json
#
# run-pole: 660s (the worst figure any job's budget line may claim)
on:
  workflow_call:

jobs:
  # Acceptance gate 1 of docs/native-backend-plan.md 5, in four shards since
  # 2026-09-03. Its own job since 2026-08-07, when it was 390s of the 860s
  # test job and shared nothing with the rest of that list but the toolchain.
  #
  # Why four. This was the run's wall clock and had passed the pole: 1119s on
  # run 33748678694 against a budget line claiming 557s and a 660s pole, with
  # a daily median that went 675s (08-31) -> 812s (09-02) -> 999s (09-03). The
  # cause is not any one entry -- gates.yml's own per-entry notes below add up
  # to under +20s over the whole climb -- it is the corpus growing (87 entries
  # in August, 122 now) times a std that every program pays for whether it
  # uses it or not (std/gpu alone is 8,198 of the 24,126 lines of C a hello
  # world now generates, and every entry compiles that twice). Restating the
  # budget was the one option the pole exists to refuse.
  #
  # What is divided is entries, never a check. Every check an entry has is made
  # inside the one shard that runs it, and known-red.txt is consulted per check
  # by name, so the ratchet is unchanged in both directions -- including the
  # half that fails a *listed* check which started passing, since whichever
  # shard owns that entry is the one that sees it. What sharding introduces is
  # the shard family's single failure: a slice nobody ran prints nothing
  # different. Each shard records what it ran and mutant-shards-complete holds
  # the union to scripts/spike-native/matrix.txt, which run.sh also holds
  # against the corpus on disk in both directions at startup.
  #
  # The delete contract is shard 1's, decided in run.sh rather than here: it is
  # one selfhost rebuild, it does not divide, and running it in four places
  # would pay for it four times. `./scripts/spike-native/run.sh --shard 1/4`
  # locally is then exactly what shard 1's job runs.
  #
  # Planning values, since no sharded run of this exists yet. Local wall clock,
  # one machine, 2026-09-03, warm toolchain, shards run one after another:
  # 150.35s / 97.25s / 106.57s / 107.00s, of which shard 1's ~47s is the delete
  # contract. Rather than double those for the runner -- the usual convention
  # here, and it would give smaller numbers -- they are scaled by this job's
  # own worst runner observation: the 1080s step splits as ~110s of delete
  # contract and ~970s of corpus, and each shard takes its measured local share
  # of the corpus. Plus 39s of checkout, toolchain action and post steps, which
  # is what those cost on the same run. That is 391s / 267s / 288s / 289s, and
  # the first real run of each replaces its line.
  #
  # Two things that number cannot promise. This gate's cost is famously not
  # reproducible -- 281s, 365s, 533s and 557s on an unchanged script, and 1119s
  # now -- because run.sh drives the corpus four at a time on a 4-vCPU runner
  # and how that lands is not ours to decide; the scaling above is anchored on
  # the worst of those, not the median, for that reason. And the local machine
  # was not idle (another build was running), which inflates the local figures
  # rather than deflating them, so the direction of that error is safe.
  #
  # Trigger for N=8: split again when a shard's own observation passes 550s
  # rather than restate a line, because 550s is where the next restatement
  # collides with the pole. Against splitting further today: a run of this
  # workflow already holds 36 jobs against an account ceiling of 20, so shards
  # five through eight would queue behind the first wave and buy budget
  # headroom rather than wall clock.

  native-diff-1:
    runs-on: ubuntu-latest
    # This shard also runs scripts/delete-contract/run.sh, which run.sh gives
    # to shard 1 alone: it is one selfhost rebuild and it does not divide.
    # budget: 3x 391s planning value (see the note above)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The per-entry ledger below is kept because it is where each corpus
      # addition's cost was argued, and every one of its measurements stands.
      # Its repeated conclusion does not: "the budget line is not restated"
      # was right about each entry in isolation and wrong about the total,
      # because the thing that grew was the floor every entry pays, and an
      # A/B against the same std cannot see that. The budget lines above
      # supersede it.
      #
      # The same program compiled by both backends must print the same bytes,
      # and both must match a written-down expectation. It also guards the
      # parts of lowering that only show up at runtime -- the spec §12.4
      # self-tail-call rewrite is a stack overflow, not a wrong answer, so no
      # amount of byte comparison catches it.
      #
      # No check is red today: known-red.txt holds no entries, only the record
      # of what each deleted one had been hiding. That file is a ratchet in
      # both directions: an unlisted failure fails the build, and so does a
      # listed check that starts passing. An empty list is the ratchet's
      # resting state, not its retirement, and it is not evidence that the
      # backend is finished -- it says the corpus no longer catches it out,
      # which is kept honest by adding programs rather than entries.
      #
      # The corpus entries run four at a time (run.sh's driver). No entry lost
      # a check to that: the transcript is replayed in corpus order and a
      # worker that is killed rather than failing is counted as a failure,
      # because a parallel harness that swallows an exit code is a green light
      # that means nothing.
      #
      # `effect_handler_state`, added 2026-08-30, is the only entry added since
      # the 557s observation. It was measured rather than assumed: the whole
      # corpus locally is 230.75s without it and 231.54s with it, four at a
      # time both times. A corpus this parallel absorbs one 6s entry into a
      # scheduling gap, so the budget line is not restated -- 557s is a runner
      # observation and nothing here moved it. An entry that did move it would
      # have to.
      #
      # `ctl_resume` and `ctl_nested` are not new entries, but their C halves
      # are: they were `.jvm-only` until one-shot resumption got a native
      # driving loop (docs/oneshot-design.md 11.10), and unblocking them adds
      # an emitc, two cc builds and two runs each. Measured the same way, and
      # it is a bigger number than the one above: the two C halves are 7.6s of
      # serial work (11.81s vs 4.24s for the pair alone, medians of three,
      # SPIKE_JOBS=1), and on the corpus at four at a time that lands as
      # 210.84s against 205.69s, medians of two. So +5s of wall on a 206s
      # local corpus, against runner observations that span 281s to 557s on an
      # unchanged script. The budget line is not restated for the same reason
      # as above; the serial figure is recorded because it is the one that
      # would show if the pool ever stopped being four wide.
      #
      # `ctl_vthread` and `ctl_cross_thread`, added 2026-08-31, are two more
      # entries and both are `.jvm-only`: one `dawn run` and one `__emitc` that
      # is required to fail, no C half at all. 4.4s for the pair serially
      # (SPIKE_JOBS=1). On the whole corpus four at a time, two interleaved
      # pairs on an otherwise idle machine: 247.43/245.68s without them and
      # 249.12/248.87s with, so +2.4s. The budget line is not restated, for
      # `effect_handler_state`'s reason. Interleaving is not decoration -- the
      # first attempt measured +23.6s because the "with" run shared the machine
      # with another job and the "without" run did not, and a corpus this
      # parallel makes a single unpaired comparison worthless.
      #
      # `ctl_discard`, added 2026-08-31 with the `discard` primitive
      # (docs/oneshot-design.md 11.12), is a both-backends entry, so unlike the
      # two above it does carry an emitc, two cc builds and two runs. Measured
      # the same way, two interleaved pairs on an idle machine: 244.43/243.42s
      # without it and 246.54/248.09s with, so +2.1s and +4.7s, +3.4s taken
      # together. The budget line is not restated for the same reason: 557s is
      # a runner observation on an unchanged script and a corpus this parallel
      # absorbs three seconds into a scheduling gap.
      #
      # `ctl_discard_fault`, added 2026-09-01 with `catch_fault`'s effect row
      # (docs/audit/error-model-design.md §7.5), is a both-backends entry: one
      # emitc, two cc builds, two runs. 6.2s serially (SPIKE_JOBS=1, median of
      # three: 6.23/6.26/6.22). Two interleaved pairs on an idle machine:
      # 275.18/276.50s without it and 285.17/278.11s with, so +10.0s and +1.6s,
      # +5.8s taken together. The spread between the two pairs is larger than
      # the entry, which is the same scheduling noise the `ctl_discard` note
      # above measured; the budget line is not restated for its reason either.
      # On 2026-09-02 its observation point went from a pure signature to an
      # `!io` one (a continuation carries its remainder's io bit now); the
      # pure spelling is a checker-corpus refusal (`continuation_row.dawn`)
      # and the program's output is unchanged, so nothing here moved.
      #
      # `narrow_round`, added 2026-09-02 with std/narrow, is a both-backends
      # entry and the largest program in the corpus (3,470 generated lines of
      # Float literals): one emitc, two cc builds, three runs. 18.5s serially
      # (SPIKE_JOBS=1, the entry alone). Two interleaved pairs on an idle
      # machine: 331/316s without it and 331/318s with, so +0s and +2s. The
      # budget line is not restated for `effect_handler_state`'s reason: a
      # corpus this parallel absorbs one entry into a scheduling gap, and
      # 557s is a runner observation on an unchanged script.
      - name: native differential (both backends, plus written expectations; shard 1 of 4)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/spike-native/run.sh --shard 1/4

      - name: record which entries this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-spike-native-1
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  native-diff-2:
    runs-on: ubuntu-latest
    # 2026-09-04: the first sharded runs replace the planning value, as the
    # note above says they would -- the worst over the four completed main
    # runs of 2026-09-03 (15:26Z .. 17:42Z) is 302s (run 33779014329), 35s
    # over the 267s planning value. On the pruned tree this shard ran 140s,
    # which the line may not follow while pre-prune runs are in the window.
    # scripts/gate-observations.py pulled it; scripts/check-gate-budgets.py
    # --observed is the audit that named it.
    # budget: 3x 302s worst observed
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The corpus ledger is above native-diff-1.
      - name: native differential (both backends, plus written expectations; shard 2 of 4)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/spike-native/run.sh --shard 2/4

      - name: record which entries this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-spike-native-2
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  native-diff-3:
    runs-on: ubuntu-latest
    # budget: 3x 288s planning value (see the note above)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The corpus ledger is above native-diff-1.
      - name: native differential (both backends, plus written expectations; shard 3 of 4)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/spike-native/run.sh --shard 3/4

      - name: record which entries this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-spike-native-3
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  native-diff-4:
    runs-on: ubuntu-latest
    # budget: 3x 289s planning value (see the note above)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The corpus ledger is above native-diff-1.
      - name: native differential (both backends, plus written expectations; shard 4 of 4)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/spike-native/run.sh --shard 4/4

      - name: record which entries this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-spike-native-4
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  # The ssh login name and the site's real IP must not enter this public repo:
  # the redeploy scripts once hardcoded them and they survived in history until
  # a cleanup. This guard inspects only the checked-out tree, so it belongs in
  # the reusable gate set that both branch CI and release tags execute.
  tree-policy:
    runs-on: ubuntu-latest
    # 6s until the gate map step was added 2026-08-11, then 53s: run
    # 31459477646, of which the map itself is 45s (25.8s locally). The floor
    # this job used to take was there because 3x six seconds is a bound no
    # runner could meet; at 53s that reason has expired, so it takes the
    # ordinary 3x rule like every other job of its size.
    # 2026-09-03: the map step reads Emit-Change declarations back to the last
    # tag, so it grows with the commits since that tag; at 25 commits past
    # v0.72.0 it took 3m21s (run 33684451459) and the 3-minute bound cancelled
    # the job twice. Sized to that observation; it shrinks again at each tag.
    # budget: 3x 201s worst observed
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          # the gate map replays four commits' trees as fixtures, and reads
          # the Emit-Change declarations back to the last tag.
          #
          # release.yml reuses this file at a tag, so the full history is
          # fetched there too, and the fixtures pin five specific SHAs. That
          # is fine forward (a tag is always cut after those commits, and main
          # is never rewritten) and it does mean this workflow can no longer
          # run at a commit older than the oldest fixture. If you ever need
          # that, drop the stanzas rather than the fetch depth.
          fetch-depth: 0
      - name: no server identity in the repo
        run: python3 scripts/check-no-server-identity.py

      # The 3x rule below was prose until 2026-08-10, and prose drifted: two
      # jobs sat three seconds under their own bound for a day. It reads the
      # workflow files, so it belongs in the job that needs no toolchain.
      - name: every timeout is backed by an observation
        run: python3 scripts/check-gate-budgets.py

      # Which gate sees which change was nobody's written-down knowledge until
      # two batches derived it wrong on the same day (see the header of
      # gatemap.py). This recomputes the answer from the workflows, the goldens
      # and the scripts, holds every rule to a mutant that uniquely reddens it,
      # ratchets the paths no gate watches, and replays both failures on the
      # trees they happened on. It needs no toolchain and reads the same three
      # workflow files the step above does.
      - name: the gate map still describes this tree
        run: python3 scripts/gate-map/gatemap.py --check

  # The syntax family's compiling mutants: syntax-small's five, pattern-or's
  # fourteen and for-pattern's twenty-eight, one whole compiler build each.
  # As one step of checker-corpus they measured 926~1111s on five consecutive
  # main runs — the whole run's wall clock — so they run as three round-robin
  # shards (#299). Every shard re-runs all three harnesses' fixture contracts
  # and matrix validations, which are seconds, so no shard is a partial
  # verdict about what the contracts assert; only the mutants are divided.
  # Each shard writes down the mutants it actually executed, and
  # mutant-shards-complete holds the union of the shards to the matrices,
  # because a shard that skips a slice prints the same PASS lines as one that
  # ran it.
  syntax-mutants-1:
    runs-on: ubuntu-latest
    # 47 mutants over three shards at the unsplit step's worst observation
    # (1111s) is ~370s of mutants per shard, plus the fixture contracts
    # (~40s) and the toolchain (~38s): ~450s was predicted for the worst
    # shard; the first run came in at 397/316/340s across the three shards.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 472s (run 33736919486), which the
    # 397s claim was 75s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # 2026-09-04: 476s (run 33774195662) over the four completed main runs of
    # 2026-09-03 (15:26Z .. 17:42Z), 4s over the 472s claim.
    # budget: 3x 476s worst observed
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: syntax ownership and recovery contract (shard 1)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/syntax-small-contract/run.sh --shard 1/3
      - name: record which mutants this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-syntax-1
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  syntax-mutants-2:
    runs-on: ubuntu-latest
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 506s (run 33683419900), which the
    # 316s claim was 190s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # budget: 3x 506s worst observed
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: syntax ownership and recovery contract (shard 2)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/syntax-small-contract/run.sh --shard 2/3
      - name: record which mutants this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-syntax-2
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  syntax-mutants-3:
    runs-on: ubuntu-latest
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 404s (run 33727540404), which the
    # 340s claim was 64s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # budget: 3x 404s worst observed
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: syntax ownership and recovery contract (shard 3)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/syntax-small-contract/run.sh --shard 3/3
      - name: record which mutants this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-syntax-3
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  # SEM-14's builtin type inventory: twenty-six compiling mutants, measured
  # 721~848s as one step of the docs job on five consecutive main runs, which
  # made docs the second-longest job of every run. Two round-robin shards
  # (#299); each first runs probe.py against the real compiler, so no shard
  # is a partial verdict, and each reports to mutant-shards-complete like the
  # syntax shards above. Two shards rather than three because the third would
  # buy ~140s that is not on the critical path and cost another queued job.
  builtin-type-1:
    runs-on: ubuntu-latest
    # 26 mutants over two shards at the unsplit step's worst observation
    # (848s) is ~420s of mutants per shard, plus the probe and the toolchain:
    # ~470s was predicted for the worst shard; the first run came in at
    # 477/359s across the two shards.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 557s (run 33734826386), which the
    # 477s claim was 80s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # budget: 3x 557s worst observed
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: builtin type inventory contract (shard 1)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/builtin-type-contract/run.sh --shard 1/2
      - name: record which mutants this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-builtin-type-1
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  builtin-type-2:
    runs-on: ubuntu-latest
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 553s (run 33742987376), which the
    # 359s claim was 194s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # budget: 3x 553s worst observed
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: builtin type inventory contract (shard 2)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/builtin-type-contract/run.sh --shard 2/2
      - name: record which mutants this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-builtin-type-2
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  # The classfile gate's thirteen compiling Never mutants (TEST-01's call and
  # adapter termination assertions), moved whole out of `contracts` (#299):
  # at ~14s a mutant the block was ~180s of that job's classfile step and
  # shares nothing with the corpus loop but the javac'd Verify classes, which
  # both sides recompile for ~2s. Not sharded and not under the coverage
  # guard: the block runs whole in this one job, so a missing slice is this
  # job red, not a silence. If the matrix outgrows ~25, give it the
  # syntax-mutants treatment and put it under mutant-shards-complete.
  classfile-never-mutants:
    runs-on: ubuntu-latest
    # ~180s for the mutant block inside the contracts job's 246~258s
    # classfile step, plus the real-compiler probe, javac and the toolchain:
    # ~260s was predicted; the first run came in at 258s.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 282s (run 33744995496), which the
    # 258s claim was 24s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # budget: 3x 282s worst observed
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: classfile Never mutants
        run: ./scripts/classfile-verify/run.sh --never-mutants-only

  # The core suite: the compiler's own tests, the self-hosting proof and the
  # gates that read the compiler's source or grammar rather than its products.
  test:
    runs-on: ubuntu-latest
    # Every timeout in this file is roughly 3x the job's own measured wall
    # clock, re-measured after the 2026-08-10 redistribution (run 31353623211
    # for the steps, which moved between jobs but did not change cost), so a
    # gate that got slower says so by failing rather than by being edited, and
    # a gate that hangs is killed in minutes instead of burning the 6h default
    # -- which is what "no timeout-minutes" means, on a runner nobody is
    # watching. Each job's own figure below is the worst of its predicted and
    # its measured time in the first run after the move (31355056313), because
    # a bound derived from the luckier of two observations is a bound that
    # fails on a Tuesday. This job: 264s predicted, 216s measured (was 731s
    # before the redistribution). The `effect_sam_snapshot` entry added to the
    # evidence corpus 2026-08-31 is one `dawn run` and one `dawn test` of a
    # small program, 2.0s locally for the pair; doubled and rounded up, the
    # planning value is 265 + 4 = 269s, whose 3x is 807s and still inside this
    # job's fourteen minutes, so the timeout does not move. The narrow
    # contract step added 2026-09-02 is 27s locally (one generator check, the
    # corpus on both backends as the clean control, and three mutants at one
    # JVM run plus one C build and run each; the runtime object is built
    # once); doubled, the planning value is 269 + 54 = 323s, whose 3x is 969s,
    # so the timeout goes to 17. The run's wall clock does not move: 323s is
    # far under the native-diff pole. The tile golden step lived here for one
    # day (2026-09-02, +34s planning value); it moved to the tile-golden
    # shards below the same day, when it grew a tileiras step behind a 150 MB
    # wheel download that nothing else here needs, so the planning value is
    # back to 323s and the timeout to 17.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 515s (run 33748678694), which the
    # 323s claim was 192s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # 2026-09-04: 540s (run 33772614654) over the four completed main runs of
    # 2026-09-03 (15:26Z .. 17:42Z), 25s over the 515s claim; 3x crosses 27
    # minutes, so the timeout follows.
    # budget: 3x 540s worst observed
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The bundled standard library's own inline test blocks (`dawn test
      # --stdlib`). std had none at all until 2026-08-06: the contract scripts
      # covered dtoa, hamt, pvec, inflate and the Unicode tables, and
      # everything else in std -- the string affix family, split/replace/pad,
      # the list quantifiers, max_by's tie rule, the cursor bridge -- was
      # checked only by whatever the compiler happened to call. `dawn test
      # std/str.dawn` cannot work (std names intrinsics no user module may,
      # and its `impl Iter[String]` is an orphan anywhere else), so the runner
      # learned a flag instead.
      - name: standard library tests
        run: ./bin/dawn test --stdlib

      # std/narrow's rounding against an exact rational oracle. Both backends
      # compile the same Dawn source, so their agreement (native-diff runs the
      # same corpus entry) cannot see a wrong rounding rule: the generator in
      # scripts/narrow-contract is the outside opinion, and the corpus is its
      # output written down as literals. The step checks the corpus is what
      # the generator generates, runs it on both backends, and then removes
      # each of the three rounding rules in turn (ties to even, the subnormal
      # clamp, the overflow threshold) from a copy of std and requires the
      # section that owns the rule to go red on both backends. 27s locally.
      - name: narrow float contract (exact oracle, both backends, three mutants)
        run: ./scripts/narrow-contract/run.sh

      # compiler-plan is an internal top-level package, not one of the
      # publishable packages/* discovered below. Its inline tests own the
      # manifest/MVS/source-input planning boundary and must run explicitly.
      - name: compiler Planner tests
        run: ./bin/dawn test compiler-plan

      # source packages (packages/, docs/package-design.md 项目 B): every
      # package with a suite of its own, plus playground consuming them via
      # [deps]. sha2 and inflate carry published test vectors -- the ones that
      # say the implementation is the algorithm and not something that merely
      # round-trips with itself. The five packages used to be listed here by
      # hand, which was right about today's tree and blind to tomorrow's; the
      # script discovers them, for the reason the examples step below gives.
      - name: package tests
        run: ./scripts/package-tests.sh

      # examples/ carries inline test blocks and, until K-A8.3, nothing ran
      # them: the differentials emit calc.dawn and compare bytes,
      # classfile-verify links those bytes, and neither executes an assertion.
      # K-A8.3 fixed that for two files by naming them; the script discovers
      # every example instead, because a hand-kept list is a thing a new
      # example gets left off. This step tests helpers and assertions, not main.
      - name: example tests
        run: ./scripts/example-tests.sh

      # A test block can stay green while the tutorial entry point panics or
      # prints the wrong thing. Mirror the gallery's unit discovery rule,
      # require an exact registry bijection, then let `dawn run` be the sole
      # authority on whether each unit has one usable entry. Every launch owns
      # a process group, including descendants left after a normal exit.
      - name: example main contracts
        run: |
          python3 scripts/example-main-contract/selftest.py
          python3 scripts/example-main-contract/run.py

      - name: selfhost tests
        run: ./bin/dawn test selfhost

      # An effect's evidence is only wrong at run time: #335, #345 and #346
      # were all `dawn check` accepting a program that then panicked with
      # "effect evidence missing", and a checker corpus cannot see that class
      # because the checker is what said yes. The programs that catch it are
      # scripts/spike-native/effect_*.dawn, and until now the only job that
      # ran them was native-diff -- behind a C compiler, a sanitizer and 281s
      # to 557s of wall clock, for a gate whose subject is backend agreement
      # rather than the answer. This is the same corpus on the JVM alone, and
      # it also holds the corpus to a roster, which nothing did (deleting a
      # case was green). 30s locally: 12s of self-test, 18s of corpus. The
      # self-test runs first because it is the thing that says the checks
      # after it can fail at all.
      - name: effect evidence contract
        run: |
          ./scripts/effect-evidence-contract/run.sh --self-test
          ./scripts/effect-evidence-contract/run.sh

      # This reusable gate covers the comptime call chain, actionable hint,
      # default/impl frames, and frame cap through four compiling mutants;
      # both main and release call this workflow.
      - name: comptime trace contract
        run: ./scripts/comptime-trace-contract/run.sh

      # The self-hosting proof: seed → A → B → C, cmp B C — the compiler
      # reproduces itself byte-identically from its own output.
      - name: selfhost fixed point (B == C)
        run: ./scripts/selfhost-fixpoint.sh

      # TEST-04's other half: the grammar as executable expectations. The EBNF
      # is historical because a hand-kept second grammar re-rots; this corpus
      # is where a divergence shows up as a failing case instead of waiting
      # for someone to read both. reject/ cases pin the *reason*, so a case
      # that starts failing differently is a failure.
      - name: grammar corpus
        run: ./scripts/grammar-corpus/run.sh

      # SYN-08 crosses lexer state, parser folding, comptime and both emitters.
      # The grammar corpus pins rejection, while this contract checks the JVM
      # and native answers against a written oracle and inspects generated C
      # so CInt and VInt must both use the standard boundary macro.
      - name: Int.MIN literal contract
        run: ./scripts/int-min-contract/run.sh

      # #124: the parser that decides whether an emit difference is approved.
      # It fails silently in both directions -- a declaration it cannot read
      # becomes a rule matching nothing, one that is too broad becomes a rule
      # matching everything -- so it is fed the inputs that must be refused.
      # No JVM, no seed, no history: it runs anywhere the repo does.
      - name: Emit-Change declaration parser
        run: ./scripts/emitchange-selftest.sh

      # `std` is on this list as of 2026-08-06. It had been off it since the
      # list existed, which nothing noticed while std was 3900 lines nobody
      # was adding to -- the first suite written into it arrived unformatted
      # in two modules, and `dawn fmt --check` was green because it was never
      # pointed at them. `examples` joined for the same reason: it was the
      # last Dawn in the repo the formatter was not pointed at, and it is the
      # code most readers see first.
      - name: formatting
        run: ./bin/dawn fmt compiler-plan std site selfhost packages examples --check

  # What the compiler emits and what std computes, checked against something
  # that is not the compiler: the JVM verifier, a javac-built reference, the
  # JDK's own Schubfach and Unicode tables, java.util.zip, AddressSanitizer.
  # These share nothing with the suite above but the toolchain, and together
  # they were 180s of the old `test` job.
  # The contract block, in two jobs since 2026-09-03. It was 759s against a
  # 660s run pole, and with native-diff sharded it would have been the run's
  # longest job. Its 25 steps share nothing but the toolchain -- each drives
  # its own script over its own fixtures -- so the boundary is drawn where the
  # measured seconds balance, and nothing else had to change.
  #
  # No matrix and no `--shard`: what is being divided is a written list of
  # steps, not a list of items a runner iterates, so a shard library would add
  # a coverage record whose oracle is the file it was copied from. Dealing
  # steps between two jobs is visible in the diff and in the two job logs, and
  # a step deleted from both halves is a step deleted from the workflow, which
  # is what review is for. (The shard family exists for the other shape: a
  # matrix the runner walks, where a skipped slice prints the same output.)
  #
  # Where each step went, and why, from the per-step maxima of five main runs
  # (33748678694, 33744995496, 33742987376, 33736919486, 33734826386):
  #
  #   contracts-1  375s  classfile 46, opaque twin 35, Map reuse 80, tea
  #                      reconciler 78, Inflate 31, ASM adapter 25, dtoa 17,
  #                      Core IR 16, Array 11, adapter call sites 8, JSON 6,
  #                      Collection 5, table freight 5, builtin mirror 5,
  #                      Unicode 3, Path 2, Error model 2, intrinsic parity 0
  #   contracts-2  346s  atomic write 84, RC parameter-mode 71, source loop
  #                      label 57, ctl-live 54, range bound 34, display
  #                      layering 24, RC contract 22
  #
  # 29s apart, which is under 4% and inside the spread of a single step
  # between runs. The split is also contiguous in the old file order, and that
  # is not a coincidence dressed up as a plan: the expensive half is the seven
  # steps that build a private compiler or a sanitized runtime, and they were
  # already written together at the end of the list. Balancing by seconds and
  # cutting along that seam turned out to be the same cut.
  #
  # The ledger below is the old job's, kept because it is where each step's
  # cost was argued; the two budget lines that follow supersede its arithmetic.
    # 545~576s complete on five consecutive main runs (2026-08-18/19, with
    # both of the steps the older 654s planning value had to add on paper).
    # The classfile step's thirteen Never mutants (~180s of its 246~258s)
    # moved to the classfile-never-mutants job on 2026-08-20 (#299), so the
    # planning value was ~400s; the first run without the block came in at 356s.
    # The rc-mode step added 2026-08-27 is 34s locally; doubled for the
    # runner, the planning value is 356 + 70 = 426s -- still under the
    # native-diff pole, so the run's wall clock does not move. Re-measure and
    # restate after the first green run. The builtin-decl step added
    # 2026-08-27 is 2.3s locally (one `dawn run` of a small project plus two
    # Python passes); doubled and rounded up, the planning value is 426 + 5 =
    # 431s. The poisoned leg added to the RC contract step 2026-08-28 takes
    # that step from 3.5s to 8.0s locally (three more sanitized builds of the
    # runtime and eight more process runs); doubled, the planning value is
    # 431 + 9 = 440s, still well under the native-diff pole, so the run's
    # wall clock does not move. The state-cell assertions and their mutant,
    # added 2026-08-30, take the RC contract step from 8.7s to 9.1s locally
    # (three assertions that allocate a handful of boxes, and one more mutant
    # leg: a copy of the runtime, one compile, one run); doubled and rounded
    # up, the planning value is 440 + 1 = 441s. That is one second over 22
    # minutes' worth of 3x, so the timeout goes to 23 -- still far under the
    # native-diff pole, and the run's wall clock still does not move. The
    # batch-tail roster added 2026-08-30 takes the RC contract step from 12.7s
    # to 15.2s locally (median of three interleaved pairs on one machine; the
    # absolute figures are higher than the 9.1s recorded above because this is
    # a different laptop, so only the +2.5s difference is transferable). It
    # buys the tail leg a red set: one more mutant, and a second build of the
    # 1024-byte-batch binary for each of the two benign mutants and the tail
    # one. Doubled and rounded up, the planning value is 441 + 5 = 446s.
    # The site's search panel, also 2026-08-30, is a 22nd gallery unit: the
    # example tests take 22.9 -> 24.3s locally and the example main contracts
    # 23.4 -> 24.9s, so 2.9s local and ~6s doubled; 446 + 6 = 452s, which is
    # still inside 23 minutes' worth of 3x and still far under the
    # native-diff pole, so neither the timeout nor the run's wall clock moves.
    # The ctl-live step added 2026-08-31 is 12.4s locally (median of three:
    # 12.47/12.30/12.42), which is one `dawn __emitc`, eight `cc` builds of
    # the emitted C against a runtime copy, and eight process runs; doubled and
    # rounded up, the planning value is 452 + 26 = 478s. That is over 23
    # minutes' worth of 3x, so the timeout goes to 24. The run's wall clock
    # still does not move: 478s is under the native-diff pole of 557s, and the
    # pole is what the run's length is. Knife 6 puts two more mutants in that
    # matrix (2026-08-31), which is four more `cc` builds and four more process
    # runs: 12.4 -> 18.6s locally (median of three: 18.67/18.59/18.38, and
    # 12.4 x 12/8 = 18.6 is the same figure predicted from the build count, so
    # the two measurements are on comparable machines). Doubled and rounded up,
    # +13, so the planning value is 478 + 13 = 491s -- over 24 minutes' worth
    # of 3x, so the timeout goes to 25. Still under the native-diff pole, so
    # the run's wall clock does not move. PR #34 then made map-reuse build a
    # private compiler, taking that step from 7s to 33s locally. Rather than
    # add another doubled estimate to the ledger, five consecutive complete
    # main runs measured this job at 558/496/534/521/414s (runs 33527666436,
    # 33525141306, 33486981520, 33477989743 and 33475732421). The 558s worst
    # observation supersedes the 491s planning value; 3x is 1674s, so the
    # timeout is 28 minutes. It remains below the 660s run-pole, which does
    # not move.
  contracts-1:
    runs-on: ubuntu-latest
    # No CI observation of this half exists yet -- the job is new. The
    # planning value is this half's own steps at their worst over the five
    # runs above (375s) plus the job's fixed overhead at its worst over the
    # same five (checkout 3s, the toolchain action 32s, set-up and the two
    # post steps 3s = 38s): 413s. That is a sum of runner observations rather
    # than a local measurement doubled, which is the better estimate available
    # here and is why it is not doubled again. It supersedes the 558s line the
    # unsplit job carried, and the first run of this job replaces it.
    # 2026-09-04: the first runs of this half replace the planning value --
    # 419s (run 33774195662) over the four completed main runs of 2026-09-03
    # (15:26Z .. 17:42Z), 6s over it. The pruned tree ran 271s; the line may
    # not follow that while pre-prune runs are in the window.
    # budget: 3x 419s worst observed
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # TEST-01: every emitted class force-linked through the JVM verifier.
      # The differentials prove the backends agree, never that the bytes are
      # legal; lazy linking means a class no test touches is never verified.
      # The thirteen compiling Never mutants that ride along in a full local
      # run are the classfile-never-mutants job's step; the two halves
      # partition the script's no-flag run.
      - name: classfile verification
        run: ./scripts/classfile-verify/run.sh --without-never-mutants

      # K-A7: the compiler emits `dawn/rt/Asm`, the five null adapters that
      # used to be the last handwritten Java in the trusted base. Every other
      # gate here is green whatever that class contains, including nothing --
      # this one drives both surfaces and compares the class files they
      # produce, against the reference Java source from `kotlin-final`.
      #
      # That reference being compiled by javac, from an archived tag, is the
      # only step in the chain that does not pass through the Dawn compiler,
      # and the adapter now emits itself -- so it is also the only thing
      # standing between us and a self-propagating defect (#134, §5.7). Read
      # run.sh's header before changing anything here: several plausible
      # simplifications leave this step green and prove nothing.
      - name: ASM adapter contract (emitted dawn/rt/Asm vs dawn.tool.AdtClassWriter)
        run: ./scripts/asm-adapter-contract/run.sh

      # K-A7 phase 2, the other half: the contract above says the two adapters
      # are interchangeable, which is exactly why nothing else can tell whether
      # the 114 call sites moved. This reads the emitted constant pools and
      # answers it -- no `dawn/tool` reference left, and `dawn/rt/Asm` actually
      # reached (either assertion alone passes on an empty directory).
      - name: adapter call sites (emitted compiler names dawn/rt/Asm only)
        run: |
          rm -rf /tmp/gate-emit && mkdir -p /tmp/gate-emit
          ./bin/dawn __emit selfhost -o /tmp/gate-emit > /dev/null
          ./scripts/adapter-callsites.py /tmp/gate-emit

      # `__emit` compares bytes, which covers Core only where a shipping
      # backend reads it. CModule.dicts has no shipping reader at all, and
      # CParam.mode / CDup / CSDrop are emitted as nothing by `__emit`, which
      # is the JVM emitter -- all three can be rewritten with every other gate
      # staying green (the counting nodes reach only the C backend). This
      # is what sees them, and it is the "Core unchanged" evidence R4 rests on.
      - name: Core IR golden
        run: ./scripts/selfhost-core-diff.sh

      # Spec 2.7 promises an opaque type *is* its target at run time, and that
      # promise is one a script can hold: run each case twice, once with
      # `opaque type` replaced by `alias`, and require the output to match.
      # Twelve functions were breaking it on 2026-07-27, two of them by
      # answering wrongly rather than crashing -- and a comment describing the
      # hazard sat thirty lines above one of them, so this is here because
      # documentation demonstrably did not transfer.
      # Both sides of every comparison capture stderr, so until the liveness
      # checks landed a toolchain that failed identically on both printed `ok`
      # for every case and exited 0 -- and one case had been dead that way since
      # RD-06 removed the `list.head` it called. --self-check drives three
      # broken toolchains through the script and requires each to be refused;
      # it runs no real compilation, so it costs milliseconds.
      - name: opaque twin (an opaque type behaves as its target)
        run: |
          ./scripts/opaque-twin/run.sh --self-check
          ./scripts/opaque-twin/run.sh

      # Float rendering's only independent oracle. std/fmt.dawn says outright
      # that it does not re-test dtoa because this script pins it byte for
      # byte -- and until 2026-08-08 the script ran nowhere, so the claim
      # pointed at nothing. Everything else that touches Float rendering
      # compares the two backends, and both compile the same Dawn source: a
      # wrong shortest-round-trip rule is a *shared* wrong answer there and
      # invisible. The JDK's Schubfach is the outside opinion.
      #
      # The full 200,000-sample default runs on every push; it costs ~14s
      # wall, so there is no reason for a reduced push tier.
      - name: dtoa contract (Float rendering vs the JDK)
        run: ./scripts/dtoa-contract/run.sh

      # Java compresses, Dawn decompresses. That direction is the point: a
      # round trip through one implementation proves only self-consistency.
      - name: Inflate contract
        run: ./scripts/inflate-contract/run.sh

      # Case folding and classification are the two operations with a table
      # behind them rather than a derivation, so the backends cannot share an
      # implementation -- only the data. This checks that both answer from the
      # compiler's tables, and that those tables still match the JDK they were
      # generated from.
      - name: Unicode contract
        run: ./scripts/unicode-contract/run.sh

      # The one collection primitive a backend owes the language. Its in-place
      # append is a contract clause, not an optimization -- losing it makes the
      # accumulation loop quadratic again, and nothing else here would notice.
      - name: Array contract
        run: ./scripts/array-contract/run.sh

      # The other `array_with` axis. The step above accumulates with `++`, so
      # every call it counts comes from std/pvec; `map.insert` reaches the
      # same primitive through std/hamt and the two rates move independently.
      # They did, by 29 points, while the step above measured the identical
      # 11241/11241 on both sides. The whole script is 33s locally on a warm
      # toolchain (66s runner-doubled), of which about 31s is the private
      # compiler build for the keep-record-spread-source mutant. It runs in
      # `contracts`, budgeted at 28 minutes from a 558s worst observation.
      - name: Map reuse contract
        run: ./scripts/map-reuse-contract/run.sh

      - name: Collection contracts
        run: |
          ./scripts/hamt-contract/run.sh
          ./scripts/pvec-contract/run.sh

      # packages/tea-core's reconciler is the one piece of the tree with no
      # production caller and no way to get one here (the terminal's increment
      # is a screen row, not a node). A package suite alone would then be a
      # suite marking its own homework, so this adds the reconciler it replaced
      # as an oracle over 484 tree pairs and 30 mutants that must each turn the
      # suites red. 42s measured, on a job budgeted at 265s.
      - name: tea reconciler contract
        run: ./scripts/tea-reconciler-contract/run.sh

      # std/fspath replaces a `use java` the compiler spelled in two places, so
      # the thing it replaces is the oracle.
      - name: Path contract
        run: ./scripts/path-contract/run.sh

      # JSONTestSuite as a gate, not a claim: y_ accepted + round-trips,
      # n_ rejected, i_ only counted (scripts/json-suite.sh has the story)
      - name: JSON suite
        run: ./scripts/json-suite.sh

      # Those tables are pruned to what a program can reach, and "can reach"
      # has to mean what the artifact actually holds -- test blocks included,
      # since the JVM emits them. selfhost cannot notice a shortfall here: its
      # own non-test code uses every table.
      - name: table freight
        run: ./scripts/table-freight/run.sh

      # The other thing std pruning made load-bearing: which module's copy of a
      # shared dictionary a program links against. It used to be whichever the
      # emitter met first, i.e. the order std/modules.txt lists modules in, and
      # that made one `==` on strings pin std/gpu (issue #69). 2.6s measured on
      # a warm toolchain -- two `__emitc` runs of a six-line program.
      - name: dictionary owner contract
        run: ./scripts/dict-owner-contract/run.sh

      # The other half of the intrinsic contract. `types.Intr.rt` makes a
      # runtime-owned primitive impossible to implement on one backend only;
      # the ones each backend writes inline had no such guard, just a `panic`
      # in each emitter that fired in the *user's* compile if a corpus ever
      # reached that name. This walks the table instead.
      - name: intrinsic parity (both backends, the same primitives)
        run: ./scripts/intrinsic-parity.py

      # The same table, read by a person instead of a backend.
      # `selfhost/builtins.dawn` is all 98 builtins as declarations, one line
      # each, and this holds it to the table in both directions -- name,
      # signature, visibility and comptime availability. A mirror nothing
      # compares is a document that goes stale the day after it is written,
      # and a stale mirror of an API is worse than none, because a reader
      # believes it. Seven mutants ride along; they are string edits held in
      # memory, so the whole step is seconds and needs no shard.
      - name: builtin declaration mirror
        run: ./scripts/builtin-decl-contract/run.sh

      # `ForeignError.kind` is the backend's own name for a failure class, so
      # the native differential can only ask whether it is a name at all --
      # one expectation, two backends, different names. This is where the JVM's
      # names are written down, and what stops the handler drifting back to the
      # `toString()` rendering the string barrier still hands back.
      - name: Error model contract
        run: ./scripts/error-contract/run.sh

  # The other half: the steps that build a private compiler or a sanitized
  # runtime. See contracts-1 for the split and the arithmetic.
  contracts-2:
    runs-on: ubuntu-latest
    # 346s of steps plus the same 38s of fixed overhead, from the same five
    # runs; no observation of this job itself yet.
    # 2026-09-04: 386s (run 33779014329) over the four completed main runs of
    # 2026-09-03 (15:26Z .. 17:42Z) replaces the planning value, 2s over it.
    # The pruned tree ran 215s, for the reason contracts-1 gives.
    # budget: 3x 386s worst observed
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The atomic manifest write, its six failure steps, a live mutant per
      # promise, and the two call sites it was raised for -- `dawn add` and
      # `dawn lock`, each with a private selfhost JAR that puts it back to
      # `io.write_file`. It lands in this job rather than next to the delete
      # contract (which spike-native's full corpus run owns) because it wants
      # both a JVM compile and a `cc`, and `native-diff` is the critical path
      # while this job is not: 67s on the runner (53s locally), and `contracts`
      # was 218s of a 13min budget before the call-site section.
      - name: atomic write contract
        run: ./scripts/atomic-write-contract/run.sh

      # Reference counting, checked in C: `rc.dawn` decides where every dup and
      # drop goes, and this drives the runtime half of that contract directly.
      # The oracle is AddressSanitizer -- a drop that fails to recurse is a leak,
      # one that recurses twice is a double free -- plus a small-stack run,
      # because drop walks a 200k-node chain and must not do it by recursing.
      # A fourth leg, added 2026-08-28, builds the runtime with the sanitizer
      # *and* the slab allocator (-DDAWN_SLAB_FORCE) and reads the hand
      # poisoning off six probe processes and two mutants of its own.
      - name: RC contract
        run: ./scripts/rc-contract/run.sh

      # The other memory oracle, and the one AddressSanitizer cannot be.
      # A continuation nobody resumes is a parked carrier thread, whose stack
      # is a root, so LeakSanitizer reports nothing when the runtime forgets to
      # reclaim it (measured: 800 KB, zero reports). `dawn_ctl_live` counts
      # instead -- and until now nothing could turn *it* red, because a correct
      # program says nothing about a counter. One Dawn program compiled once
      # and run against the tree's runtime plus three mutations of it, with the
      # red sets recorded in both directions.
      - name: ctl-live contract
        run: ./scripts/ctl-live-contract/run.sh

      # The parameter-mode contract (core.CMode) under single-sided flips:
      # a call-site table row without the callee's CParam.mode, and the
      # mirror, each must be caught by rc_check / ASan / LSan, while the
      # coherent flip -- the borrowed knife's semantics in miniature -- must
      # run clean. It rides here for the atomic-write step's reason: it wants
      # a JVM compile and a `cc` with sanitizers, and this job is not the
      # critical path. The four known-red entries are the harness's findings;
      # read that file before touching them.
      - name: RC parameter-mode mutants
        run: ./scripts/rc-mode-contract/run.sh

      # RC's match-only unloop rewrite must not erase a source loop that still
      # owns a named break or continue target. The compiling mutant restores
      # the broad recognizer, runs the complete assertion set, and must turn
      # only source_loop_target_is_retained red; the match optimization stays
      # green as an independent control.
      - name: source loop label contract
        run: ./scripts/source-loop-label-contract/run.sh

      # Range `for` bounds are evaluated once before the loop, in source order.
      # The compiling mutant restores the old upper-first Core statement list
      # and must turn only range_bound_order_is_lower_first red. A separate
      # Core-only control keeps the once-before-loop half independent of stdout.
      - name: range bound order contract
        run: ./scripts/range-bound-order-contract/run.sh

      # `Display` decides the top-level rendering in place of `Show`, and the
      # question is asked at every peel layer of an opaque stack. Two compiling
      # mutants, one per rule: dropping the question turns both assertions red,
      # asking it once turns only the peel-layer one red. The nested rendering
      # is a control neither may move.
      - name: display layering contract
        run: ./scripts/display-layering-contract/run.sh

  # Slice C's classpath contract owns a fixture-only Maven repository and
  # private caches, so it cannot share dependency state with the broad test
  # job. Its compiling negative controls rebuild nine private selfhost JARs.
  #
  # The supply-chain guards below joined it on 2026-08-10: they are the other
  # gates that resolve dependencies, read dawn.lock or drive the planner's
  # fetch, and they cost 68s in a job that had room for them.
  java-target-classpath:
    runs-on: ubuntu-latest
    # 262s predicted (194s + 68s moved in); 270s then 281s measured on two
    # consecutive runs of the same tree, so the budget follows the worse one.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 301s (run 33672841752), which the
    # 281s claim was 20s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # 2026-09-04: 306s (run 33774195662) over the four completed main runs of
    # 2026-09-03 (15:26Z .. 17:42Z), 5s over the 301s claim.
    # budget: 3x 306s worst observed
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: check and doc target Java classpaths
        run: ./scripts/java-target-classpath-contract/run.sh

      # The guards in front of the bootstrap, none of which a green build can
      # see: bin/dawn's cache generation (input coverage, fail-closed manifest
      # consumer, framed digests, staged promotion and execution pairing,
      # driven offline by launcher-contract.sh with one compiling launcher
      # mutant per assertion family), and seedjar.sh's seed verification,
      # where a checked seed and an unchecked one produce the same output.
      # All are driven against the cases they exist to refuse, with controls
      # -- a stamp that moves for everything and a resolver that refuses
      # everything would each pass half of this on their own.
      - name: bootstrap guards (cache generation, seed verification)
        run: ./scripts/bootstrap-guards/run.sh

      # PKG-04: the resolved [java-deps] closure must still match dawn.lock --
      # a moved transitive version or a mirror answering with different bytes
      # is a reproducibility break, and this is where it surfaces. It is also
      # what stands behind the coursier cache in the setup action: a cache
      # holding a different closure fails here.
      - name: java-deps lock
        run: ./bin/dawn lock --check selfhost

      # The source-package half of the same promise. `dawn.lock` covers
      # [java-deps]; [deps.<alias>] is pinned by a content hash instead, and
      # that pin has a blind spot a lock cannot have: the cache is addressed by
      # hash, so bumping `url` to a new tag and forgetting `hash` resolves the
      # *old* tree and builds green. Three consumer upgrades caught that by
      # hand, by mis-typing the hash once on purpose to prove the fetcher still
      # said no. This is that discipline as a check.
      - name: package cache url/hash guard
        run: ./scripts/pkg-origin-contract/run.sh

      # TOOL-10: source fetch + MVS produce the one graph from which Java
      # coordinates are collected. A cold file-target build must see the
      # winner's jar, while a syntactically valid poison coordinate in the MVS
      # loser must never reach Coursier or dawn.lock.
      - name: source plan contract
        run: ./scripts/source-plan-contract/run.sh

      # The source-input wire protocol is consumed by bootstrap tooling, not by
      # Maven/MVS planning. Keep its real hidden-CLI checks and compiling
      # Planner mutants independently attributable.
      - name: bootstrap input manifest contract
        run: bash ./scripts/bootstrap-input-manifest-contract/run.sh

      # Target Java signatures come from one platform-parent loader per lease;
      # behavior mutants pin query isolation, parent choice and both close paths.
      - name: target-scoped Java signature leases
        run: ./scripts/jsig-lease-contract/run.sh

  # Slice D owns private source overlays, a fixture-only Maven repository and
  # twenty compiling selfhost mutants. It shares no mutable fixture state
  # with the broad test job, so keeping it independent makes failures
  # attributable and keeps the same gate in branch and release workflows.
  #
  # Every other gate that speaks LSP moved here on 2026-08-10. They start
  # language servers and read their traffic, which is this job's subject; the
  # project-plan contract is here because analysis and completion are its two
  # consumers.
  lsp-workspace:
    runs-on: ubuntu-latest
    # Cold runners compile one observed server plus every mutant from scratch.
    # 403s predicted (196s + 168s moved in); 370s then 421s measured on two
    # consecutive runs of the same tree -- a 14% spread on identical work, the
    # same non-reproducibility `native-diff` documents. Budget the worse one.
    #
    # That pair was observed with eighteen mutants, and neither of the two
    # added since restated it (drop-diagnostics-version, unopened-version-zero).
    # A mutant costs one private selfhost build plus its owning case: 5.1s
    # locally, three runs, 4.4s build + 0.7s case, 0.2s spread. This job runs
    # about 3.1x slower on the runner than locally (421s over nineteen builds
    # against 7.0s per build locally), which over-states the per-mutant figure
    # because the gates moved in here are inside the 421s and outside that
    # division. 16s each on the runner, so 421s + 2 x 16s.
    # budget: 3x 453s planning value (421s observed at eighteen mutants, two added at 16s each)
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: LSP workspace ownership and mutants
        run: ./scripts/lsp-workspace-contract/run.sh

      # The language server's *scheduling*, which nothing else here can see:
      # selfhost-lsp-diff.sh compares output bytes, and a server that spins a
      # core or never notices its client left is byte-identical to a
      # well-behaved one. Three assertions -- exits after hangup, publishes
      # diagnostics, stays near-zero CPU while silent -- recorded before the
      # debounced read loop of docs/audit/lsp-robustness-design.md §2.2 lands,
      # so the change has a baseline to be held to. Each was made to fail on
      # its own first (§2.2.2); the liveness one is why `cat` cannot pass.
      - name: lsp liveness (hangup, diagnostics, idle CPU)
        run: ./scripts/lsp-liveness.py

      # Framing errors are not recoverable JSON errors: every malformed,
      # conflicting, truncated or oversized frame gets one fixed response and
      # closes the read loop. This drives raw streams rather than normalized
      # transcripts, including the 8 KiB/64 MiB allocation boundaries.
      - name: lsp framing boundaries and fatal recovery
        run: ./scripts/lsp-framing.py

      # Lifecycle messages gate document updates and pending analysis: no open
      # buffer may become observable before initialize or after shutdown.
      - name: lsp lifecycle sequencing and mutants
        run: ./scripts/lsp-lifecycle-contract/run.sh

      # `use`-line completion, against the tree it describes. The transcript
      # gate cannot assert this (it compares against a release that has no such
      # feature) and liveness reads no payloads, so without this the answers
      # were checked by nobody. Its oracle is the filesystem -- directory
      # listings, std/modules.txt, the [deps] table -- so a new module keeps it
      # green and a broken walk turns it red.
      - name: lsp use-path completion
        run: ./scripts/lsp-use-completion.py

      # Which std the server loads, asserted from cwds that are not the
      # checkout -- the only place the bug lived. An editor picks the server's
      # cwd, so a run from the repo root (which every other LSP gate here does)
      # is exactly the configuration that stayed green while the editor showed
      # 281 phantom diagnostics. Covers the two halves the inline test on
      # `lsp_std_dir` cannot reach: the CLI dispatch passing `--std` through,
      # and bin/dawn exporting DAWN_STD from its own location. ~19s.
      - name: lsp std resolution (cwd independence)
        run: ./scripts/lsp-std-resolution.py

      # Analysis and completion must consume one captured source plan. Both
      # fail-closed edges carry compiling mutants: loader replanning and LSP
      # completion discarding the document's module index.
      - name: project plan capture and completion consistency
        run: ./scripts/project-plan-contract/run.sh

  # The wasm target: the failure runtime, and the DOM bridge over it.
  #
  # Both harnesses ran by hand until now, and scripts/wasm-contract's own
  # header said why: the toolchain was whatever apt shipped, and the
  # .dawn-version discipline says a gate must pin what it downloads before it
  # gates anyone. It downloads a pinned wasi-sdk now, so it can.
  #
  # They share a job because they share the two expensive things -- the
  # wasi-sdk and the C driver built from selfhost/src/nmain.dawn -- and
  # neither is worth paying for twice. Neither is on any other job's critical
  # path: nothing `needs:` this, and its budget is well under the run pole
  # (native-diff, above).
  wasm-target:
    runs-on: ubuntu-latest
    # Not observed on a runner yet; this is the planning value, in the shape
    # list-elems-contract's is. Re-measured locally on the pin below
    # (2026-08-26): 12s for the wasi-sdk step, 36s for the driver, 30s for the
    # failure contract, 27s for the DOM contract, ~45s for the checkout and
    # the toolchain action = 150s. The first four are timed; the last is still
    # the carried estimate. The two halves of the old note disagreed (a prose
    # sum of 141s against a budget line reading 129s); these agree.
    # The DOM contract was 12s while it had one transcript; the todo case
    # (a second reactor build, a second transcript and two more rebuilding
    # mutants) added ~9s, and the keyed-ops, props, payload, foreign and
    # collector sections (no wasm build; the collector compiles Dawn with
    # bin/dawn instead of driving node) ~14s between them. The flags section
    # added 4.5s locally (2026-08-30): two node mutants, and three `dawn run`
    # compiles of a small project for the guest leg and its two mutants. The
    # collector section's production half, added the same day, takes that
    # section from 8.6s to 14.5s locally: four more `dawn test` compiles of
    # examples/projects/tea_dom_search, which is a bigger project than the
    # fixture (it consumes tea-core, tea-dom and json).
    # The retained-state section adds one direct C ownership probe, two JVM
    # compiles of its tiny fixture (base and production mutant), and two wasm
    # builds of the same pair. Its first green runner observation (33318400446)
    # took 92s for the complete DOM contract and 250s for this whole job,
    # including setup and the failure contract. Both are below the existing
    # 300s planning value, so the budget does not move.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 341s (run 33748678694), which the
    # 300s claim was 41s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # budget: 3x 341s worst observed
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A version is a name; the checksum is the identity. The bytes GitHub
      # serves under a tag can be re-uploaded, and this runner then executes
      # them as a compiler. So the sha256 is written down here rather than
      # fetched next to the tarball -- a checksum from the same place as the
      # file it checks is not a check -- and the two move together or not at
      # all, the same rule .dawn-version.sha256 states for the compiler jar.
      #
      # Why 34, and what had to change to get here. 30 was the newest release
      # the shipped `--target wasm` link line worked with unchanged: from 31
      # (LLVM 22) on, linking anything built with `-fwasm-exceptions` fails
      # with `undefined symbol: __cpp_exception`, because that exception tag
      # stopped being emitted as a weak definition in every object file that
      # needed it and moved into libunwind. Upstream's answer is `-lunwind`,
      # which exists only in sysroot 33 and newer and would strand every
      # older toolchain including apt's. This runtime defines the tag itself
      # instead, in runtime/c/dawn_rt_wasi_tag.c, which is a translation unit
      # of its own for the reason written at the top of that file.
      #
      # The triple is the other half and is unrelated to exceptions: 31
      # deprecated wasm32-wasi and 34 removed it, while apt's wasi-libc has
      # only wasm32-wasi and no wasm32-wasip1. Neither spelling reaches both
      # ends, so `cc_build_for` asks the compiler which one it has a sysroot
      # for rather than hardcoding either, and the apt path stays alive.
      #
      # With those two, 25 / 27 / 29 / 30 / 31 / 33 / 34 all build and all
      # produce a byte-identical DOM transcript, so the pin stays a choice
      # about the toolchain and not about the answers. 34 is the newest, and
      # it is LLVM 23: the isel crash that forces the failure runtime onto its
      # A1 shadow stack (dawn_rt.c, "landing at a handler") is gone there,
      # so any future attempt to drop that shadow stack goes through this pin.
      #
      # Wall clock: 34's tarball is 192,383,077 bytes against 30's
      # 119,449,290, up 61%. Measured here on one link, the whole step went
      # 11.7s to 12.4s: the download itself is bandwidth-bound rather than
      # size-bound at this scale (9.4s against 8.9s, inside the noise) and
      # the +1.3s is the extra unpacking. Budget +5s to be safe; nothing
      # `needs:` this job, so it is not on any critical path either way.
      - name: the pinned wasi-sdk
        run: |
          v=34
          sha=b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
          curl -fsSL -o wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${v}/wasi-sdk-${v}.0-x86_64-linux.tar.gz"
          echo "${sha}  wasi-sdk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasi-sdk"
          tar xzf wasi-sdk.tar.gz -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          rm -f wasi-sdk.tar.gz
          echo "DAWN_WASM_CC=$RUNNER_TEMP/wasi-sdk/bin/clang" >>"$GITHUB_ENV"

      # Both harnesses build this from nmain.dawn when it is not handed one,
      # and it is 35s of the job. Built once here, passed to both.
      - name: the C driver, once
        run: |
          ./bin/dawn __emitc selfhost/src/nmain.dawn -o "$RUNNER_TEMP/nmain.c"
          cc -std=c11 -O2 -fwrapv -fexceptions -fno-strict-aliasing -pthread \
            -I runtime/c -o "$RUNNER_TEMP/dawnc" "$RUNNER_TEMP/nmain.c" \
            runtime/c/dawn_rt.c -lm
          echo "DAWNC_BIN=$RUNNER_TEMP/dawnc" >>"$GITHUB_ENV"

      # catch/bracket/raise on wasm, held to the native run byte for byte,
      # plus the leak ledger this target has in place of LeakSanitizer and
      # four negative controls.
      - name: wasm failure contract
        run: ./scripts/wasm-contract/run.sh

      # The whole Elm loop across the boundary -- reactor, message passing,
      # patch stream, DOM mutations, event routing -- against a recording
      # document stub, held to two transcripts (the counter and the todo
      # list), with nine mutants, plus six legs that need no wasm toolchain:
      # the keyed ops, the props, the payloads, the foreign elements, the
      # collector (which needs bin/dawn instead of node, because how a child
      # list is built is invisible to the encoder), and the init flags (which
      # needs both, one leg per side of the boundary).
      - name: wasm DOM bridge contract
        run: ./scripts/wasm-dom-contract/run.sh

  # packages/tileir's Tile IR against the two records that can say it is
  # wrong: the text and bytecode goldens beside scripts/tile-golden/run.sh
  # (layer 0 of docs/tile-backend-design.md 6.2: both backends, byte for
  # byte, plus the handler's determinism) and NVIDIA's `tileiras` assembling
  # each bytecode golden for sm_86 (layer 1: the one verdict from outside
  # this repository, with a reader and a verifier behind it that name the
  # offset and the operation when they refuse), and every cubin carrying a
  # GLOBAL FUNC named after its kernel. Layer 1's verdict is the exit code
  # AND an empty error stream: knife 7b measured tileiras writing a cubin,
  # exiting 0 and printing a refusal (an f64 `tanh` with a rounding mode it
  # does not accept), which a gate reading only the status would have
  # called green. Fifteen mutants: two on the handler
  # and renderer that the text golden catches, two on the handler's region
  # stack that the lowering refuses before any text (a loop's token not
  # carried out, the stack popped the wrong way round), and the rest on the
  # writer (an opcode swap, a flagged operand left unwritten, two wrong type
  # tags, a loop's value index not rolled back, a misplaced flag bit, an
  # `ftoi` rounding mode the dialect does not accept, a scan given a
  # reduce's result type, an atomic claiming the one memory ordering the
  # dialect forbids it, and a compare-and-swap given the read-modify-write's
  # `mode` byte) that the text cannot see and tileiras refuses.
  #
  # tileiras is an offline assembler: no GPU, no driver, it links libc, libm
  # and libpthread only and reads libnvvm.so.4 and execs ptxas from two
  # sibling wheels. install-tileiras.sh downloads the three wheels
  # scripts/tile-golden/toolchain.txt pins by exact version and refuses any
  # whose sha256 differs, the same rule as the wasi-sdk step above (a
  # checksum from the same place as the file is not a check); the pin and
  # the bytecode version the writer emits are held together by run.sh.
  #
  # Three jobs of their own because the wheels are 150 MB and nothing else
  # needs them, so a slow package index delays nothing but these. Nothing
  # `needs:` them. They are the three round-robin shards of one matrix
  # (scripts/tile-golden/matrix.txt: the 66 kernels, then the 15 mutants, in
  # run order). Sharding by kind was the plan written down at knife 7b and the
  # phase measurement retired it: locally the kernel loop is 204s (102 JVM
  # starts, and nothing else -- the native binary runs all 51 kernels in 0.3s
  # and tileiras takes 3.3s for the lot) against the mutants' 175s (a native
  # rebuild each, 9.2s a time). Neither half dominates, the kernel half is the
  # one growing faster (~8s per new kernel against ~21s per new mutant), and a
  # split by kind would have left one job carrying it. Every Nth item of the
  # mixed list divides both at once, and spreads the outliers with them
  # (`reverse` alone costs five average kernels).
  #
  # The split cannot reach the verdicts. A kernel's four runs, its two goldens
  # and its assembly all happen inside one shard, and each mutant compares
  # against the recorded goldens on disk rather than against its own shard's
  # kernel output -- so the twelve named red sets survive being dealt into
  # three jobs, one shard at a time. What it does introduce is the shard family's
  # one failure: a shard that silently skips a slice prints the same PASS
  # lines and exits 0. So each records what it ran, and mutant-shards-complete
  # holds the union to matrix.txt.
  #
  # N=2 -> N=3 on 2026-09-04 (knife 16), by the trigger the two-shard note
  # left here: shard 1's planning value had reached 646s against a 660s pole,
  # and the slope is ~18s of planning value per new kernel, so the next knife
  # that added one kernel to that shard would have had to raise the pole. The
  # split is what the pole exists to force, and knife 16 adds eleven kernels.
  #
  # A third shard buys budget headroom and not wall clock, and that is the
  # whole of what it buys: runs of this workflow now hold 36 jobs against an
  # account concurrency limit of 20 (the arithmetic is in this file's header),
  # so the 36th queues behind the first wave rather than starting beside it,
  # and tile has never been a run's long pole -- native-diff at 783~1119s over
  # the last fortnight is. The span does not shorten. What changes is that
  # every shard is back under the 660s pole with room for the next knife.
  #
  # Trigger for N=4: the same one, one level up -- split again when any
  # shard's own OBSERVATION passes 550s rather than restate its budget, since
  # 550s doubled is already past the pole.
  #
  # Shard 1 carries two more steps, both well under a second and neither
  # shardable. The first is layer 2's ledger gate (docs 6.4, decision D4):
  # scripts/tile-gpu-diff/run.sh --check reads the last line of
  # scripts/tile-gpu-diff/ledger.txt and requires its commit to be an
  # ancestor of HEAD with no tile path changed since, its result pass or
  # blocked, and toolchain.txt's driver line to agree. The GPU run itself
  # happens on a developer machine with a driver (the runner has none);
  # the gate proves it happened at this tree. Its checkout is full depth
  # because the ancestry test needs the history, which is why shards 2 and 3
  # are not: only this one reads git. The second is the leetgpu ledger.
  tile-golden-1:
    runs-on: ubuntu-latest
    # Local wall clock, one machine, one tileiras, three round-robin shards of
    # the same matrix.txt, measured back to back against the base tree
    # (9bafffd8, knife 15). The numbers and the reasoning are in the note at
    # the head of this block and in docs/tile-backend-design.md 6.5.
    #
    # Plus the checkout, the toolchain action and the wheels (~45s and ~25s,
    # the carried estimates), doubled for a cold runner: the rule this file
    # has used since the first split.
    #
    # The planning value stays deliberately above what CI does. Run 33763512
    # at fffe98f8 observed 340s and 348s against planning values of 512s and
    # 490s, a ratio of about 0.66; the last carried CI projection for N=2 was
    # 408s and 390s. Redistributed over three shards those become about 280s
    # each, which is where this knife's projection starts from.
    # budget: 3x 460s planning value (230s local, doubled)
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: the pinned tileiras
        run: |
          bin="$(./scripts/tile-golden/install-tileiras.sh "$RUNNER_TEMP/tileiras")"
          "$bin" --version
          echo "TILEIRAS=$bin" >>"$GITHUB_ENV"

      - name: tile IR goldens and tileiras (66 kernels and fifteen mutants, both backends; shard 1)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/tile-golden/run.sh --shard 1/3

      - name: record which items this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-tile-golden-1
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

      - name: GPU diff ledger is current (layer 2 ran at this tree)
        run: ./scripts/tile-gpu-diff/run.sh --check

      - name: the leetgpu ledger (a listed problem has a kernel and a device run)
        run: |
          python3 scripts/leetgpu-diff/check.py
          python3 scripts/leetgpu-diff/check.py --self-test

  tile-golden-2:
    runs-on: ubuntu-latest
    # The note above tile-golden-1 carries the measurements and the reasoning
    # for all three shards; each one restates the arithmetic on its own local
    # reading, because a budget line has to be readable beside the timeout it
    # bounds.
    # budget: 3x 460s planning value (230s local, doubled)
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: the pinned tileiras
        run: |
          bin="$(./scripts/tile-golden/install-tileiras.sh "$RUNNER_TEMP/tileiras")"
          "$bin" --version
          echo "TILEIRAS=$bin" >>"$GITHUB_ENV"

      - name: tile IR goldens and tileiras (66 kernels and fifteen mutants, both backends; shard 2)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/tile-golden/run.sh --shard 2/3

      - name: record which items this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-tile-golden-2
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  tile-golden-3:
    runs-on: ubuntu-latest
    # The third shard, added with the N=2 -> N=3 split on 2026-09-04. Same
    # matrix, same tileiras, same arithmetic; the note above tile-golden-1
    # carries the measurements.
    # budget: 3x 460s planning value (230s local, doubled)
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: the pinned tileiras
        run: |
          bin="$(./scripts/tile-golden/install-tileiras.sh "$RUNNER_TEMP/tileiras")"
          "$bin" --version
          echo "TILEIRAS=$bin" >>"$GITHUB_ENV"

      - name: tile IR goldens and tileiras (66 kernels and fifteen mutants, both backends; shard 3)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/tile-golden/run.sh --shard 3/3

      - name: record which items this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-tile-golden-3
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  # The checker's diagnostics, recorded in the order `cerr` appends them.
  # Nothing else here can see them -- grammar-corpus stops at the parser,
  # spike-native compares program output, and the Core golden compares the IR,
  # so the wording, the span and above all the *order* of 475 diagnostics could
  # all move with every gate green. The ratchet in uncovered.txt is the other
  # half: it fails when a `cerr` no case reaches appears, so coverage cannot
  # quietly regress either.
  checker-corpus:
    runs-on: ubuntu-latest
    # The syntax mutant family (926~1111s of this job on five consecutive
    # main runs, the whole run's wall clock) moved to the syntax-mutants
    # shard jobs on 2026-08-20 (#299). What remains — the corpus itself
    # (175~202s remote), the Java narrowing contract (30~34s) and the
    # toolchain (~38s) — was ~280s predicted from those same runs; the first
    # run without the syntax step came in at 240s.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 357s (run 33748678694), which the
    # 240s claim was 117s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # budget: 3x 357s worst observed
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: checker diagnostic corpus
        run: ./scripts/checker-corpus/run.sh

      # SEM-06: an erased Java Object must not acquire a hidden CHECKCAST just
      # because an overload wants a concrete reference. The contract also
      # compiles the safe widening/Bytes/SAM/List paths and runs both source
      # mutants, including the structurally forbidden backend fallback.
      - name: Java narrowing contract
        run: ./scripts/java-narrowing-contract/run.sh

  # SYN-05: the general pipe. It left the `test` job when it grew its mutants,
  # for the reason export-surface is split above: one build per rule does not
  # fit in a job that is already 216s.
  #
  # What the mutants own is not the pipe's behaviour, which the checker,
  # grammar and native corpora all pin. It is that each of those assertions is
  # owned by exactly one sentence of the desugar, and that property rots
  # silently: SYN-09's persisted mutants are how an anchor drift was caught
  # when SYN-05 added an `XCtor` arm to the same match (2d5f19a), and the pipe
  # had no equivalent until now. So every mutant runs the whole assertion set
  # and its red set is diffed against a recorded matrix; asserting only that a
  # mutant reddens its owner would leave the ownership itself unchecked, which
  # is the same failure one level up. Every shard re-runs the fixture, editor
  # and formatter contracts and validates the whole ownership structure, which
  # reads the record and needs no build, so no shard is a partial verdict.
  pipe-contract-1:
    runs-on: ubuntu-latest
    # 152s and 140s locally for the two shards (7 and 6 builds each, plus the
    # fixture contract); 300s for the whole suite. Running all 22 assertions
    # against every mutant rather than only its owner roughly doubled this
    # (82s and 72s before), so the build does *not* dominate the way it looked
    # like it would: an already-built mutant still pays a JVM start per
    # assertion. It buys the ownership property, which was prose until the
    # matrix became the gate. 258s predicted on the runner from
    # export-surface's measured 122s -> 206s ratio for the same kind of work;
    # the budget takes the worse of the two, as `test` explains. Re-derive from
    # the first run to carry them, the way 30af350 did for export-surface.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 284s (run 33727540404), which the
    # 258s claim was 26s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # budget: 3x 284s worst observed
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: general pipe contract (shard 1)
        run: ./scripts/pipe-contract/run.sh --shard 1/2

  pipe-contract-2:
    runs-on: ubuntu-latest
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 265s (run 33744995496), which the
    # 258s claim was 7s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # budget: 3x 265s worst observed
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: general pipe contract (shard 2)
        run: ./scripts/pipe-contract/run.sh --shard 2/2

  # SYN-09: which Java member `recv.name(args)` reaches. Its own job for the
  # same reason java-target-classpath is: the subject is a javac-built fixture
  # handed over with --cp, and the ten negative controls rebuild ten private
  # selfhost JARs, which is more than any existing job has room for -- adding
  # it to checker-corpus (354s) would have made that job the critical path.
  java-member-dispatch:
    runs-on: ubuntu-latest
    # 300s predicted from java-target-classpath's nine builds (270s there;
    # locally the ten cost 158s, which is not the runner's figure), 292s
    # measured in the first run to carry it (31364390451); see `test`.
    # budget: 3x 292s worst observed
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Java member dispatch contract
        run: ./scripts/java-member-dispatch-contract/run.sh

  # TEST-04: the documentation's own examples, links and anchors. The audit
  # found a wrong README example, an install command that did not run and an
  # EBNF out of step with the parser -- all by human reading. Marking the
  # front-page example `dawn run` failed on the first run (it called a `sum`
  # that does not exist), which is the whole argument.
  #
  # The site and playground gates joined it on 2026-08-10: the site is the
  # documentation's other output, and this is now the only job that sets up
  # node.
  docs:
    runs-on: ubuntu-latest
    # The builtin type inventory contract (721~848s of this job on five
    # consecutive main runs) moved to the builtin-type shard jobs on
    # 2026-08-20 (#299). What remains: doc-check (124~136s), site tests, the
    # playground contract, the site build, the dist differential (~50s
    # together) and node + toolchain setup (~36s).
    #
    # The playground contract grew a second leg on 2026-08-30 (the bounded
    # WebSocket/LSP gateway: framing, admission, lifecycle and the checked-in
    # deployment boundary). It costs 5.2s locally and ~5s here, taking that
    # step from 13s to 14~19s, which is inside the job's own spread.
    #
    # Restated by measurement on 2026-08-30 rather than by adding the leg to
    # the 171s that stood here: five consecutive main runs (33294261922,
    # 33295761978, 33297339676, 33298632339, 33299520375) took 232, 215, 220,
    # 212 and 210s, two of them before the new leg existed. The old figure was
    # stale on its own, mostly through doc-check, and the leg is not why.
    #
    # The search index and the header's search panel (also 2026-08-30) add
    # 2.8s locally across three steps: site tests 1.50 -> 1.83s, the site
    # build 6.91 -> 7.24s (the spec, the design notes and the tutorial are
    # parsed a second time for their headings, and two 42KB assets are
    # written), and the dist differential 11.39 -> 13.52s. Doubled for the
    # runner that is ~6s against the 232s worst above, inside the job's own
    # 210~232s spread, so the budget line does not move.
    #
    # The specification's one-shot section (2026-09-01) carries two runnable
    # blocks in each language, so doc-check compiles and runs four programs
    # more: 84.96 -> 88.74s locally, two runs each side and nothing else on the
    # machine. Doubled for the runner that is ~7.5s against the same 232s
    # worst, so the budget line does not move for the same reason.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 302s (run 33742987376), which the
    # 232s claim was 70s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # 2026-09-04: 312s (run 33779014329) over the four completed main runs of
    # 2026-09-03 (15:26Z .. 17:42Z), 10s over the 302s claim.
    # budget: 3x 312s worst observed
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4

      # site/build.sh builds the Playground editor bundle, so CI needs npm.
      # This job is the only one that builds the site, so it is the only one
      # that sets up node.
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: site/play-ui/package-lock.json

      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: documentation checks
        run: ./scripts/doc-check.py

      - name: site tests
        run: ./bin/dawn test site

      # The playground runs a public endpoint that compiles and executes code
      # strangers send it, and nothing here ever ran its contract test: the
      # sandbox timeout, the 413 on oversized bodies, and the check that compile
      # errors do not leak host paths were all trusted rather than exercised.
      - name: playground contract
        run: ./playground/test/contract.sh

      # This one builds site/play-ui/dist, which is not tracked and which the
      # differential below reads. They stay in this order.
      - name: site builds end-to-end (incl. the Playground editor bundle)
        run: ./site/build.sh

      # site/README.md has called "JVM and native write the same dist, byte for
      # byte" a project tradition since M5, and until now nothing enforced it --
      # it was a `diff -r` somebody ran by hand, over the live working tree, so
      # it could not tell a backend disagreement from an input that moved
      # between the two builds (it reported the latter as the former on
      # 2026-08-04). Two `use java` lines had also made the native side
      # impossible to build at all for a milestone, with the claim still on the
      # page. Read the script's header before touching it.
      - name: site dist, JVM vs native
        run: ./scripts/site-dist-diff.sh

  # The native half of the same comparison, split off because it is the longer
  # one (172s of prev-diff's 314s on 2026-08-07) and because the two steps in
  # it are joined to each other and to nothing else: the differential reuses
  # the binary the release step built. Since the 2026-08-10 redistribution it
  # is the critical path: 484s, and nothing in it can be moved elsewhere.
  prev-diff-native:
    runs-on: ubuntu-latest
    # 484s before the move, 475s after; see the note in `test`. The tea-core
    # leg of native-cli-diff.sh (the #9 regression oracle) adds ~6s locally,
    # doubled for the runner.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 526s (run 33748678694), which the
    # 496s claim was 30s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # budget: 3x 526s worst observed
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          # native-cli-diff.sh reaches the N-1 tag through selfhost-fmt-diff.sh
          fetch-depth: 0

      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build: 'false'

      # K-B7: the executable a release publishes, built and checked by the
      # same script release.yml runs. A step that only runs on tags is the
      # least-executed code in the repo; this is what keeps it honest, and it
      # costs +6.4s measured (99.5s -> 105.9s for these two steps) because the
      # differential below reuses the binary instead of building a second one.
      - name: the native release artifact
        run: ./scripts/release-native.sh -o dawnc-linux-x86_64

      # The same transcripts on the other backend (K-B2, extended by K-B3).
      # Every step in prev-diff runs ./bin/dawn, which is the JVM toolchain and
      # only that — the differentials read as "the CLI is checked" and checked
      # one backend. This holds fmt/doc/add to the JVM's bytes, re-runs the
      # formatter *and language server* differentials with the native binary as
      # the toolchain under test, and checks that both servers answer a client
      # that has not closed the connection.
      #
      # DAWNC_BIN points it at the artifact above rather than letting it build
      # its own: the binary these eight legs exercise is then literally the one
      # a tag would publish, not one built beside it with the same recipe.
      - name: driver subcommands on the native backend
        run: DAWNC_BIN=dawnc-linux-x86_64 ./scripts/native-cli-diff.sh

  # The hardware baseline itself stays local. CI exercises only the strict
  # JSON reader, the synthetic Linux process tree and the two source mutants.
  compiler-weight-contract:
    runs-on: ubuntu-latest
    # 2026-09-03: this claimed the floor, and the floor is for jobs whose own
    # 3x no runner could meet. It has not been one of those for a while: the
    # worst of 57 completed main runs since 09-02 is 200s (run 33622624446),
    # of which the contract step itself is a flat 183s on every run in the
    # window. 3x that is 600s against the 300s the floor was granted, so the
    # claim was not merely stale, it was the wrong kind of claim.
    # scripts/check-gate-budgets.py --observed is what named it; the job is
    # unchanged, only what is said about it.
    # budget: 3x 200s worst observed
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: compiler weight schema and synthetic process contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/selfhost-bench-contract/run.py

  # The list literal's element forms (spec §4.11): ten compiling mutants, one
  # per sentence of `..xs` and the else-less `if`, each run against the whole
  # assertion set and diffed against a recorded matrix.
  #
  # Its own job rather than a step of `contracts`, which is where the other
  # single-purpose mutant contracts sit. That job's worst observation is 356s
  # against a 660s run pole, and 145s of local mutants at runner speed would
  # put its next budget claim on the pole itself. A job costs a queue slot;
  # the pole costs the whole run.
  list-elems-contract:
    runs-on: ubuntu-latest
    # Ten `dawn build`s of the compiler at ~6s each plus twelve assertion runs
    # per mutant: 145s locally, and no CI observation yet. 290s is that
    # doubled for the runner, which is the planning value the two sharded
    # mutant jobs used before their first runs corrected them (#299); replace
    # it with the observation once there is one.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 307s (run 33734826386), which the
    # 290s claim was 17s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # 2026-09-04: 313s (run 33786130335) over the four completed main runs of
    # 2026-09-03 (15:26Z .. 17:42Z), 6s over the 307s claim.
    # budget: 3x 313s worst observed
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: list element contract
        run: ./scripts/list-elems-contract/run.sh

  # Phase 2 measures process semantics, not runner hardware. The complete
  # contract measured 60s locally, and the reused toolchain setup has a 29s
  # observed upper bound. Keep it parallel to the 163s Phase 1 contract.
  dependency-heap-contract:
    runs-on: ubuntu-latest
    # budget: 3x 90s combined worst observed
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build: 'false'
      - name: dependency re-exec inherits the effective parent heap
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/dependency-heap-contract/run.py

  # The extension grammar is editor behavior, not documentation. Exercise it
  # with VS Code's TextMate engine and Oniguruma WASM in a standalone job so a
  # broken scope rule cannot hide behind the compiler toolchain setup.
  editor-grammar:
    runs-on: ubuntu-latest
    # measured 6s; a floor, for the reason tree-policy gives.
    # budget: floor (seconds-scale job)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: VS Code TextMate scope contract
        working-directory: editors/vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test --silent

      # The extension was publishable in principle and had never been packaged,
      # which is how its manifest came to claim MIT in an Apache-2.0 repository
      # and to point at an icon that did not exist. Packaging is the step that
      # reads the manifest as the marketplace reads it, so it runs here rather
      # than being remembered at publish time. The .vsix is not uploaded: only
      # the maintainer's marketplace token can publish, and a build artifact
      # nobody installs is not evidence of anything.
      - name: the extension packages
        working-directory: editors/vscode
        run: npm run package

  # What a toolchain says when the std it loaded is not the std it shipped
  # with (#226). Every failure used to be one sentence, and on the native
  # driver that sentence blamed the installation for a std the user's working
  # directory had shadowed in.
  std-version:
    runs-on: ubuntu-latest
    # Seven private compiler builds: one per mutant, plus the probe that
    # corrupts the compiled-in std. 63s locally. java-member-dispatch's ten
    # builds cost 158s locally and 292s on the runner, which puts this one at
    # about 205s here; restate the number from the first run that carries it.
    # budget: 3x 205s predicted from java-member-dispatch's local/runner ratio
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Std version contract
        run: ./scripts/std-version-contract/run.sh

  # N vs N-1 (scripts/selfhost-prev-diff.sh): the previous release and HEAD
  # compile the same corpus and any byte difference must be declared in a
  # commit message. This is the oracle now that the Kotlin reference is
  # archived (kotlin-final), and doubles as the machine enforcement of the
  # seed feature discipline — the N-1 jar must still compile HEAD
  # selfhost/src. The same job replays the run/fmt/lsp transcripts against
  # the N-1 toolchain, the successors of the old Kotlin golden diffs.
  prev-diff:
    runs-on: ubuntu-latest
    # 210s before the move and 210s after it; see the note in `test`.
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 213s (run 33731092049), which the
    # 210s claim was 3s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # 2026-09-04: 215s (run 33779014329) over the four completed main runs of
    # 2026-09-03 (15:26Z .. 17:42Z), 2s over the 213s claim.
    # budget: 3x 215s worst observed
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          # the declared-change scan walks commits since the N-1 tag
          fetch-depth: 0

      # build: false — every script below drives the seed and builds what it
      # needs itself, so a toolchain built up front would only be built again.
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build: 'false'

      - name: N vs N-1 differential
        run: ./scripts/selfhost-prev-diff.sh

      - name: run/test transcript vs N-1
        run: ./scripts/selfhost-run-diff.sh

      - name: formatter vs N-1
        run: ./scripts/selfhost-fmt-diff.sh

      - name: lsp transcript vs N-1
        run: ./scripts/selfhost-lsp-diff.sh

  # SEM-07: a public declaration may only name identities its audience can
  # name. Three jobs rather than one because the evidence is 24 mutant
  # compilers -- one per rule -- and a mutant costs a whole build. Splitting
  # keeps this off the critical path; every shard re-runs the fixture contract,
  # which is seconds, so no shard is a partial verdict about what the validator
  # accepts and rejects.
  #
  # The rules this owns are all silent when broken: a walker that peels an
  # opaque representation still accepts every legal program, one that stops at
  # a root's first leak still rejects the fixture, and one that runs after the
  # bodies still emits the same text. None of that is visible to a golden.
  export-surface-1:
    runs-on: ubuntu-latest
    # 122s locally for one shard (8 builds + the fixture contract); 201s, 192s
    # and 206s measured across the three shards in the first run to carry them
    # (31389692620), so the runner costs less here than checker-corpus's ratio
    # predicted. All three sit well under native-diff's 589s critical path.
    # budget: 3x 206s worst observed
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: public API surface contract (shard 1)
        run: ./scripts/export-surface-contract/run.sh --shard 1/3

  export-surface-2:
    runs-on: ubuntu-latest
    # 2026-09-03: restated from the Actions API -- the worst of 57
    # completed main runs since 09-02 is 227s (run 33708763790), which the
    # 206s claim was 21s under. scripts/gate-observations.py pulled it;
    # scripts/check-gate-budgets.py --observed is the audit that named it.
    # budget: 3x 227s worst observed
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: public API surface contract (shard 2)
        run: ./scripts/export-surface-contract/run.sh --shard 2/3

  export-surface-3:
    runs-on: ubuntu-latest
    # budget: 3x 206s worst observed
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: public API surface contract (shard 3)
        run: ./scripts/export-surface-contract/run.sh --shard 3/3

  # The union guard for the sharded mutant matrices. Sharding introduced
  # exactly one new way to be wrong — a mutant no shard runs — and nothing
  # else can see it: each shard prints its own PASS lines and exits 0 whether
  # it covered its slice or not. So each shard records what it executed, and
  # this job reassembles the records and holds their union to the harnesses'
  # own matrix files. Which harnesses must report is asked of the tree
  # (scripts/mutant-coverage/check.py's header says how), not of this file:
  # a shard job deleted from this file surfaces here as a named absence,
  # which is the point.
  #
  # `if: always()` so a red shard cannot swallow the completeness verdict —
  # the two failures stay separately attributable. The self-test runs first
  # because a guard whose red has never been observed is not a guard; it
  # feeds every refusal shape (missing shard, dropped mutant, double-run,
  # shard-count disagreement, absent harness) through the checker and
  # requires each to be refused. Artifacts are run-scoped, so release.yml
  # reusing this workflow at a tag cannot cross-read a branch run's records.
  mutant-shards-complete:
    needs:
      - native-diff-1
      - native-diff-2
      - native-diff-3
      - native-diff-4
      - syntax-mutants-1
      - syntax-mutants-2
      - syntax-mutants-3
      - builtin-type-1
      - builtin-type-2
      - tile-golden-1
      - tile-golden-2
      - tile-golden-3
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # budget: floor (seconds-scale job: checkout, artifact download, two python runs)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: the coverage checker can refuse
        run: python3 scripts/mutant-coverage/check.py --self-test
      - name: collect every shard's coverage record
        uses: actions/download-artifact@v4
        with:
          pattern: mutant-coverage-*
          path: coverage
      - name: the union of the shards is the whole matrix
        run: python3 scripts/mutant-coverage/check.py --coverage-dir coverage
