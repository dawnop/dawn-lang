# The counter the gates drive, kept apart from the counter people read.
#
# scripts/wasm-dom-contract builds this one as a reactor and holds it to a
# transcript; scripts/example-main-contract holds its `dawn run` session to a
# registry pin. Everything those two need and an application does not (the
# `Boom` message that panics on purpose, the `bar` whose length the model
# decides, the tests on single patches) lives here, so that
# examples/projects/tea_dom_counter, which the site's demo page shows, can be
# the counter and nothing else. When this file and that one were the same
# file, the fixtures were most of what a reader saw.
schema = 1
name = "tea_dom_counter_contract"
version = "1.0.0"

[deps]
tea_core = "../../../packages/tea-core"
tea_dom = "../../../packages/tea-dom"
