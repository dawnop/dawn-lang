name: ci

# Why this exists: the site generator was broken for a whole milestone without
# anyone noticing — docs drifted past a hardcoded lint and nothing ever built the
# site on push. The compiler suite runs in seconds, so there is no reason not to.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The ssh login name and the site's real IP must not enter this public repo:
  # the redeploy scripts once hardcoded user@dawnop.com and it sat in history (and
  # the v0.1.0 tag) until a 2026-07-18 cleanup. A convention nothing checks decays,
  # so it is a check now. Same script the local pre-push hook runs.
  secrets:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the trailer check can see the pushed commit range's
      # history; the identity guard only looks at the tree and does not need it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no server identity in the repo
        run: python3 scripts/check-no-server-identity.py

      # No Claude attribution in new commits. Suppressed at the Claude Code
      # settings source, but that is per-machine/per-session — a different machine
      # or an insistent system prompt slips it back in. commit-msg catches it
      # locally (opt-in hook), this catches it authoritatively. Such trailers once
      # had to be force-pushed out of history; this exists so that cannot recur.
      - name: no Claude attribution in commit messages
        run: |
          before='${{ github.event.before }}'
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ "$before" = 0000000000000000000000000000000000000000 ]; then
            range="HEAD~1..HEAD"
          elif git cat-file -e "$before^{commit}" 2>/dev/null; then
            range="$before..HEAD"
          else
            # A force-push orphans the previous tip, so `fetch-depth: 0` -- which
            # fetches what is *reachable* -- cannot fetch it, and a range against
            # it is not a revision at all. This step used to fail there rather
            # than check, which is precisely the operation the guard exists for:
            # the trailers it looks for were once removed by force-push. Scanning
            # the whole history instead is stricter and costs 0.04s for 500
            # commits.
            echo "note: $before is unreachable (force-push?) -- scanning all history"
            range="HEAD"
          fi
          python3 scripts/check-no-claude-trailer.py --range "$range"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # site/build.sh builds the Playground editor bundle, so CI needs npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: site/play-ui/package-lock.json

      # keep the seed jar across runs — it only changes when
      # scripts/seed-release.txt bumps
      - name: cache the bootstrap seed
        uses: actions/cache@v4
        with:
          path: .dawn/seeds
          key: dawn-seed-${{ hashFiles('scripts/seed-release.txt') }}

      # bin/dawn fetches the previous release's dawn-selfhost.jar (the
      # bootstrap seed, scripts/seed-release.txt) and rebuilds the toolchain
      # from HEAD sources. Every `./bin/dawn` step below exercises selfhost.
      - name: build the selfhost toolchain
        run: ./bin/dawn --version

      - name: site tests
        run: ./bin/dawn test site

      # source packages (packages/, docs/package-design.md 项目 B): every
      # package with a suite of its own, plus playground/site consuming them
      # via [deps]. sha2 and inflate carry published test vectors -- the ones
      # that say the implementation is the algorithm and not something that
      # merely round-trips with itself.
      - name: package tests
        run: |
          for p in packages/web packages/json packages/sha2 packages/inflate playground; do
            ./bin/dawn test "$p"
          done

      - name: selfhost tests
        run: ./bin/dawn test selfhost

      # The self-hosting proof: seed → A → B → C, cmp B C — the compiler
      # reproduces itself byte-identically from its own output.
      - name: selfhost fixed point (B == C)
        run: ./scripts/selfhost-fixpoint.sh

      # Acceptance gate 1 of docs/native-backend-plan.md: the same program
      # compiled by both backends must print the same bytes, and both must
      # match a written-down expectation. It also guards the parts of
      # lowering that only show up at runtime -- the spec §12.4 self-tail-call
      # rewrite is a stack overflow, not a wrong answer, so no amount of byte
      # comparison catches it.
      #
      # Six checks are red today and listed in known-red.txt. That file is a
      # ratchet in both directions: an unlisted failure fails the build, and
      # so does a listed check that starts passing.
      - name: native differential (both backends, plus written expectations)
        run: ./scripts/spike-native/run.sh

      # `__emit` compares bytes, which covers Core only where a shipping
      # backend reads it. CModule.dicts has no shipping reader at all, and
      # CParam.mode / CSDup / CSDrop are emitted as nothing until Perceus --
      # all three can be rewritten with every other gate staying green. This
      # is what sees them, and it is the "Core unchanged" evidence R4 rests on.
      - name: Core IR golden
        run: ./scripts/selfhost-core-diff.sh

      # Spec 2.7 promises an opaque type *is* its target at run time, and that
      # promise is one a script can hold: run each case twice, once with
      # `opaque type` replaced by `alias`, and require the output to match.
      # Twelve functions were breaking it on 2026-07-27, two of them by
      # answering wrongly rather than crashing -- and a comment describing the
      # hazard sat thirty lines above one of them, so this is here because
      # documentation demonstrably did not transfer.
      - name: opaque twin (an opaque type behaves as its target)
        run: ./scripts/opaque-twin/run.sh

      # The one collection primitive a backend owes the language. Its in-place
      # append is a contract clause, not an optimization -- losing it makes the
      # accumulation loop quadratic again, and nothing else here would notice.
      - name: Array contract
        run: ./scripts/array-contract/run.sh

      - name: Collection contracts
        run: |
          ./scripts/hamt-contract/run.sh
          ./scripts/pvec-contract/run.sh

      # std/fspath replaces a `use java` the compiler spelled in two places, so
      # the thing it replaces is the oracle.
      - name: Path contract
        run: ./scripts/path-contract/run.sh

      # Java compresses, Dawn decompresses. That direction is the point: a
      # round trip through one implementation proves only self-consistency.
      - name: Inflate contract
        run: ./scripts/inflate-contract/run.sh

      # Case folding and classification are the two operations with a table
      # behind them rather than a derivation, so the backends cannot share an
      # implementation -- only the data. This checks that both answer from the
      # compiler's tables, and that those tables still match the JDK they were
      # generated from.
      - name: Unicode contract
        run: ./scripts/unicode-contract/run.sh

      # Reference counting, checked in C: until the Core pass lands, nothing
      # emitted calls dup or drop, so no Dawn program can reach them. The
      # oracle is AddressSanitizer -- a drop that fails to recurse is a leak,
      # one that recurses twice is a double free -- plus a small-stack run,
      # because drop walks a 200k-node chain and must not do it by recursing.
      - name: RC contract
        run: ./scripts/rc-contract/run.sh

      # The playground runs a public endpoint that compiles and executes code
      # strangers send it, and nothing here ever ran its contract test: the
      # sandbox timeout, the 413 on oversized bodies, and the check that compile
      # errors do not leak host paths were all trusted rather than exercised.
      - name: playground contract
        run: ./playground/test/contract.sh

      - name: site builds end-to-end (incl. the Playground editor bundle)
        run: ./site/build.sh

      - name: formatting
        run: ./bin/dawn fmt site selfhost packages --check

  # N vs N-1 (scripts/selfhost-prev-diff.sh): the previous release and HEAD
  # compile the same corpus and any byte difference must be declared in a
  # commit message. This is the oracle now that the Kotlin reference is
  # archived (kotlin-final), and doubles as the machine enforcement of the
  # seed feature discipline — the N-1 jar must still compile HEAD
  # selfhost/src. The same job replays the run/fmt/lsp transcripts against
  # the N-1 toolchain, the successors of the old Kotlin golden diffs.
  prev-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the declared-change scan walks commits since the N-1 tag
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cache the bootstrap seed
        uses: actions/cache@v4
        with:
          path: .dawn/seeds
          key: dawn-seed-${{ hashFiles('scripts/seed-release.txt') }}

      - name: N vs N-1 differential
        run: ./scripts/selfhost-prev-diff.sh

      - name: run/test transcript vs N-1
        run: ./scripts/selfhost-run-diff.sh

      - name: formatter vs N-1
        run: ./scripts/selfhost-fmt-diff.sh

      - name: lsp transcript vs N-1
        run: ./scripts/selfhost-lsp-diff.sh
