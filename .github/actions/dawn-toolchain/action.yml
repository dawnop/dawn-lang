name: dawn toolchain
description: >
  GraalVM, the cached bootstrap seed, and the selfhost toolchain built from it.
  gates.yml is six jobs now rather than two, and this is the setup all of them
  share -- written once, because six hand-kept copies of it drift the way the
  gate list itself once drifted between ci.yml and release.yml.

inputs:
  github-token:
    description: passed to setup-graalvm so its downloads are not rate-limited
    required: true
  build:
    description: >
      build the selfhost toolchain up front. The N-vs-N-1 jobs answer 'false':
      their scripts drive the seed and build what they need themselves, so a
      toolchain built here would only be built again.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: graalvm/setup-graalvm@v1
      with:
        java-version: '21'
        distribution: 'graalvm-community'
        github-token: ${{ inputs.github-token }}

    # Keep both bootstrap inputs across runs. The pointer selects their release,
    # and either trust record may invalidate cached bytes for the same tag.
    #
    # Both checksum tables are in the key as well, so a corrected jar digest or
    # std tree hash for an unchanged tag misses rather than restores a cache the
    # resolver will immediately refuse. seedjar.sh still verifies both inputs
    # on every cache hit, not merely after a download or extraction.
    - name: cache the bootstrap seed
      uses: actions/cache@v4
      with:
        path: .dawn/seeds
        key: dawn-seed-${{ hashFiles('scripts/seed-release.txt', 'scripts/seed-checksums.txt', 'scripts/seed-std-checksums.txt') }}

    # [java-deps] resolution, so six jobs do not each ask Maven Central for the
    # same asm jar. dawn.lock is the key because it *is* the resolved closure;
    # `dawn lock --check selfhost` still runs in the test job, so a cache that
    # somehow held a different closure fails there rather than passing quietly.
    #
    # Not a speed-up, measured: this whole setup took 24-29s per job on the
    # cold run (31160611693) and 23-27s on the warm one (31161006590) -- the
    # asm jar is ~120 KB and the restore costs about what the download did.
    # It is here to take Maven Central off six jobs' critical path, which is
    # the only claim it can support.
    - name: cache resolved java-deps
      uses: actions/cache@v4
      with:
        path: ~/.cache/coursier
        key: coursier-${{ hashFiles('selfhost/dawn.lock') }}
        restore-keys: coursier-

    # bin/dawn fetches the previous release's dawn-selfhost.jar (the bootstrap
    # seed, scripts/seed-release.txt) and rebuilds the toolchain from HEAD
    # sources -- in two stages, so the jar's runtime classes come from HEAD too
    # (see the note in bin/dawn). Every `./bin/dawn` step in gates.yml exercises
    # selfhost.
    - name: build the selfhost toolchain
      if: inputs.build == 'true'
      shell: bash
      run: ./bin/dawn --version
