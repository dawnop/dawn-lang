# A consumer of packages/tileir, the same relationship the json example has to
# packages/json: the kernel below is written against the package's `Dev`
# effect, the package is not copied in here. The host half needs no dependency
# at all, `std/gpu` being std.
schema = 1
name = "gpu_fake"
version = "1.0.0"

[deps]
tileir = "../../../packages/tileir"
