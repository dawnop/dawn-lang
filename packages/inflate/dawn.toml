schema = 1
# v3 of the package the repo spells `inflate`: a major bump renames the package
# (the v2-in-name rule), and consumers keep their `use inflate/...` lines by
# aliasing: `inflate = "../packages/inflate"` in compiler-plan. The v2 break
# folded each `_bounded` twin into its base function as a defaulted `cap`; the
# v3 break changes that default from no ceiling to `DEFAULT_CAP`, 16 MiB, with
# no signature change; 3.1.0 raises it to 64 MiB, a minor bump because a larger
# ceiling fails no call that passed before. The README has both tables.
name = "inflate3"
version = "3.1.0"
