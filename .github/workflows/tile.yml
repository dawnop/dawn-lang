name: tile

# One producer builds the compiler, runtime and clean native execution closure.
# Shards receive its exact artifact and verify source, run and tool identities.
# The dispatch baseline and probe are bounded measurements, never verified trees.
# path-total: 28380s (temporary measurement claims include the separate baseline)
on:
  push:
    branches: [main]
    # The two lists are written out twice rather than shared with a YAML
    # anchor: GitHub's workflow parser does not resolve aliases. Keep them
    # identical.
    paths:
      - 'packages/tileir/**'
      - 'packages/tileref/**'
      - 'packages/tileinterp/**'
      - 'scripts/tile-golden/**'
      - 'scripts/tile-gpu-diff/**'
      - 'scripts/tileinterp-diff/**'
      - 'scripts/leetgpu-diff/**'
      - 'scripts/narrow-contract/**'
      - 'scripts/mutant-coverage/**'
      - 'std/bytes.dawn'
      - 'std/gpu.dawn'
      - 'std/narrow.dawn'
      - 'runtime/c/**'
      - 'selfhost/src/c/**'
      - 'selfhost/src/ir/**'
      - 'selfhost/src/driver/**'
      - 'selfhost/src/main.dawn'
      - 'bin/dawn'
      - '.github/workflows/tile.yml'
      - '.github/actions/**'
      - 'scripts/tile-prep/**'
      # Documentation is not a tile input: no build, golden or device program
      # reads a .md file, and scripts/tile-gpu-diff/inputs.py leaves them out
      # of the ledger digest for the same reason. A README-only change ran
      # all seven shards once in the week of 09-26 (PR #384).
      - '!packages/tileir/**/*.md'
      - '!packages/tileref/**/*.md'
      - '!packages/tileinterp/**/*.md'
  pull_request:
    paths:
      - 'packages/tileir/**'
      - 'packages/tileref/**'
      - 'packages/tileinterp/**'
      - 'scripts/tile-golden/**'
      - 'scripts/tile-gpu-diff/**'
      - 'scripts/tileinterp-diff/**'
      - 'scripts/leetgpu-diff/**'
      - 'scripts/narrow-contract/**'
      - 'scripts/mutant-coverage/**'
      - 'std/bytes.dawn'
      - 'std/gpu.dawn'
      - 'std/narrow.dawn'
      - 'runtime/c/**'
      - 'selfhost/src/c/**'
      - 'selfhost/src/ir/**'
      - 'selfhost/src/driver/**'
      - 'selfhost/src/main.dawn'
      - 'bin/dawn'
      - '.github/workflows/tile.yml'
      - '.github/actions/**'
      - 'scripts/tile-prep/**'
      # Documentation is not a tile input: no build, golden or device program
      # reads a .md file, and scripts/tile-gpu-diff/inputs.py leaves them out
      # of the ledger digest for the same reason. A README-only change ran
      # all seven shards once in the week of 09-26 (PR #384).
      - '!packages/tileir/**/*.md'
      - '!packages/tileref/**/*.md'
      - '!packages/tileinterp/**/*.md'
  schedule:
    # 05:20 UTC, twenty minutes behind nightly.yml so the two do not contend
    # for runners. GitHub's cron is best effort and drops runs at busy times,
    # which is a reason to ask for a trough and a reason not to treat a missed
    # night as a verdict.
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      experiment:
        description: Shared gate, preparation probe, or independent baseline
        type: choice
        options: [shared, probe, baseline]
        default: shared
      cold:
        description: Bypass producer dependency caches
        type: boolean
        default: false

concurrency:
  group: tile-${{ github.ref }}
  cancel-in-progress: true

env:
  # The environment version of the verified-tree record; the header says
  # when to change it.
  TILE_VERIFIED_PREFIX: tile-verified-v1-

jobs:
  dedupe:
    runs-on: ubuntu-24.04
    # Listed in full: a `permissions:` block sets everything it omits to none.
    permissions:
      actions: read        # the artifact listing, the run that made it, the pull request's run
      contents: read       # the checkout
      pull-requests: read  # commits/<sha>/pulls, the pull request a push merged
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
    # Seconds when a record exists or no pull request run is in progress (7
    # to 9 s observed). Waiting is what it costs otherwise: the four races of
    # 09-30 .. 10-01 replay to 210, 330, 480 and 570 s of waiting plus the
    # job's own 9 s. The claim is the worst case, not those: the script
    # stops waiting at 900 s, and 900 s plus the job's 7 to 9 s, rounded up
    # to 5 s, is 910 s, under the 950 s run pole.
    # budget: 3x 910s the 900s wait cap plus the job itself
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: the verified-tree lookup refuses what it should
        run: python3 scripts/tile-verified.py --self-test
      - name: has this tree already passed tile.yml?
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/tile-verified.py lookup --repo "$GITHUB_REPOSITORY" \
            --repo-id "$GITHUB_REPOSITORY_ID" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --prefix "$TILE_VERIFIED_PREFIX" --event "$GITHUB_EVENT_NAME" \
            --sha "$GITHUB_SHA"


  bootstrap:
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' && inputs.experiment != 'baseline' }}
    runs-on: ubuntu-24.04
    # budget: 3x 800s planning bound including cold dependency recovery
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha: ${{ steps.pack.outputs.full_sha }}
      manifest: ${{ steps.pack.outputs.full_manifest }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: restore producer dependencies
        if: ${{ !inputs.cold }}
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: |
            ${{ runner.temp }}/producer-deps
            ${{ runner.temp }}/tileiras-wheels
          key: tile-producer-v2-Linux-x64-21.0.2-b048069aaa3a99b8-${{ hashFiles('scripts/seed*.txt', 'selfhost/dawn.lock', 'scripts/tile-golden/toolchain.txt', 'scripts/tile-prep/full.py') }}
      - name: download recovery remains bounded and progressing transfers finish
        if: ${{ inputs.experiment == 'probe' }}
        run: python3 -B scripts/tile-prep/download-contract.py --upstream-recovery
      - name: build and package the execution closure
        id: pack
        run: python3 -B scripts/tile-prep/full.py prepare
      - name: the artifact identities can refuse
        if: ${{ inputs.experiment == 'probe' }}
        env:
          PRODUCER_ATTEMPT: ${{ github.run_attempt }}
        run: python3 -B scripts/tile-prep/full.py identity-selftest
      - name: upload the execution closure
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tile-full-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/out-full/prep.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  tile-golden-1:
    needs: [dedupe, bootstrap]
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' && needs.bootstrap.result == 'success' && inputs.experiment != 'baseline' }}
    runs-on: ubuntu-24.04
    # budget: 3x 950s planning bound retaining all historical preparation and transfer groups
    timeout-minutes: 48
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    env:
      MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
      ITEM_TIMES: ${{ runner.temp }}/ITEM_TIMES.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: start receiving the exact producer artifact
        run: echo "RECEIVE_STARTED=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: receive the exact producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.bootstrap.outputs.artifact_id }}
          path: ${{ runner.temp }}/received
          merge-multiple: true
      - name: validate and activate the execution closure
        env:
          EXPECTED_SHA: ${{ needs.bootstrap.outputs.sha }}
          EXPECTED_MANIFEST: ${{ needs.bootstrap.outputs.manifest }}
          PRODUCER_ATTEMPT: ${{ needs.bootstrap.outputs.attempt }}
          ARTIFACT_ID: ${{ needs.bootstrap.outputs.artifact_id }}
        run: python3 -B scripts/tile-prep/full.py consume
      - name: tileiras wheel cache refuses altered pins and bytes
        run: python3 scripts/tile-golden/install-contract.py
      - name: tile goldens and mutants on both backends, shard 1 of 19
        run: ./scripts/tile-golden/run.sh --prebuilt "$RUNNER_TEMP/execution-closure/native" --tileiras "$TILEIRAS" --shard 1/19 --plan scripts/mutant-coverage/plans/tile-golden.txt
      - name: record successful work and item clocks
        id: receipt
        run: python3 -B scripts/tile-prep/coverage.py receipt --index 1 --total 19
      - name: GPU diff ledger is current (layer 2 ran at this tree)
        if: ${{ inputs.experiment != 'probe' }}
        run: ./scripts/tile-gpu-diff/run.sh --check
      - name: the layer 2 verdict fold reads every family
        run: bash scripts/tile-gpu-diff/fold_verdict.sh --selftest
      - name: the leetgpu ledger (a listed problem has a kernel and a device run)
        run: |
          python3 scripts/leetgpu-diff/check.py
          python3 scripts/leetgpu-diff/check.py --self-test

  tile-golden-2:
    needs: [dedupe, bootstrap]
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' && needs.bootstrap.result == 'success' && inputs.experiment != 'baseline' }}
