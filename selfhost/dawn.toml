schema = 1
name = "selfhost"

# The self-hosted codegen drives ASM directly (selfhost/src/jvm/codegen.dawn).
# This manifest is the single place the version is declared — the old note
# pointed at compiler/build.gradle.kts for lock-step, and that file left main
# with the Kotlin implementation (archived at the kotlin-final tag). Bumping ASM
# means bumping it here; the seed vendors whatever this resolves to.
[java-deps]
asm = "org.ow2.asm:asm:9.7.1"
# Maven resolution is part of the compiler itself. Target-scoped platform
# parents cannot and must not inherit this API from the compiler process.
coursier = "io.get-coursier:interface:1.0.28"

[deps]
compiler_plan = "../compiler-plan"
fspath = "../packages/fspath"
json = "../packages/json"
sha2 = "../packages/sha2"
