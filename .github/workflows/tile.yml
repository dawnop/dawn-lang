          if-no-files-found: error
          retention-days: 1

  tile-golden-4:
    runs-on: ubuntu-latest
    # 873s of items (5233 / 6) plus one 41s setup; see shard 1's note.
    # budget: 3x 914s planning value (the eleven shards' observed work, six ways)
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: restore the pinned tileiras wheels
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tileiras-wheels
          key: tileiras-wheels-v1-${{ runner.os }}-${{ hashFiles('scripts/tile-golden/toolchain.txt') }}

      - name: the pinned tileiras
        run: |
          bin="$(./scripts/tile-golden/install-tileiras.sh "$RUNNER_TEMP/tileiras" "$RUNNER_TEMP/tileiras-wheels")"
          "$bin" --version
          echo "TILEIRAS=$bin" >>"$GITHUB_ENV"

