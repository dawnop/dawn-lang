name: dawn toolchain
description: >
  GraalVM, the cached bootstrap seed, and the selfhost toolchain built from it.
  gates.yml is thirty-eight jobs now rather than two, thirty-four of which
  need a toolchain, and this is the setup they share -- written once, because
  thirty-four hand-kept copies of it drift the way the gate list itself once
  drifted between ci.yml and release.yml, and the way these counts did. The
  counts were last recounted on 2026-09-04, when tile-golden went to four
  shards; they had been stale at twenty and seventeen since well before that.

inputs:
  github-token:
    description: passed to setup-graalvm so its downloads are not rate-limited
    required: true
  java-version:
    description: >
      the JDK setup-graalvm installs. An input rather than a literal because
      the step below is written twice, and this action exists on the premise
      that hand-kept copies drift.
    required: false
    default: '21'
  distribution:
    description: as java-version, and for the same reason.
    required: false
    default: 'graalvm-community'
  build:
    description: >
      build the selfhost toolchain up front. The N-vs-N-1 jobs answer 'false':
      their scripts drive the seed and build what they need themselves, so a
      toolchain built here would only be built again.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # setup-graalvm downloads a JDK from an upstream release host, and when that
    # download fails it fails every job holding this action at once: 2 to 4 of
    # the seventeen, a different set each time, on two occasions. Retrying is the
    # whole fix, and a retry action cannot deliver it -- nick-fields/retry and
    # its kin re-run a shell command, and this is a `uses:` step. Writing the
    # step twice and branching on the first attempt's outcome is the only
    # mechanism GitHub offers for a `uses:` step.
    #
    # `continue-on-error` and `steps.<id>.outcome` both behave inside a
    # composite action the way they do in a job: the runner gives the composite
    # its own steps scope and records outcome/conclusion for every step that has
    # an explicit id (actions/runner, CompositeActionHandler.RunStepAsync ->
    # ExecutionContext.ApplyContinueOnError/UpdateGlobalStepsContext). The id is
    # load-bearing, not decoration: UpdateGlobalStepsContext skips steps whose
    # context name is generated, so an unnamed step has no readable outcome.
    - name: set up GraalVM
      id: graalvm
      uses: graalvm/setup-graalvm@v1
      continue-on-error: true
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        github-token: ${{ inputs.github-token }}

    # A run that needed two attempts still ends green, so without this the flake
    # is invisible and its rate stays anecdotal -- which is how the outage above
    # came to be diagnosed from step names rather than from evidence. The
    # annotation puts it in the run summary, where occurrences can be counted.
    #
    # What a successful retry looks like, from the probe that exercised this
    # branch for real: a green job carrying a red `failure` annotation from
    # attempt 1, sitting beside the warning. `continue-on-error` suppresses the
    # step's outcome, not its annotation, and that pair is the mechanism working
    # rather than a broken build. Count flakes by this warning's title, then:
    # the failure annotation is emitted in the success case too, so anything
    # keying on annotation level miscounts.
    #
    # The annotation is also the only route for an observer without a token. A
    # composite collapses into one step in the jobs API, so the step names here
    # are not visible there, and GET /actions/jobs/{id}/logs answers 403 "Must
    # have admin rights to Repository." This repo works without a PAT, which
    # makes the `::warning::` load-bearing rather than a convenience.
    #
    # 15s is a guess at how long a transient upstream stays bad, not a documented
    # backoff window: long enough that the retry is unlikely to be served by the
    # same failing edge, short enough to be noise against the 24-29s this setup
    # already costs. If the warning ever becomes frequent, the number is worth
    # revisiting with the data it will by then have produced.
    - name: note the GraalVM retry
      if: steps.graalvm.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=GraalVM setup retried::graalvm/setup-graalvm@v1 failed on its first attempt and is being retried. The job may still pass. This annotation exists so the flake can be counted -- see .github/actions/dawn-toolchain/action.yml."
        sleep 15

    # The second attempt carries no `continue-on-error`, so it is the gate: two
    # failures fail the job, and no job can reach the steps below without a
    # toolchain. `continue-on-error` appears exactly once in this file, above.
    - name: set up GraalVM (second attempt)
      if: steps.graalvm.outcome == 'failure'
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
        github-token: ${{ inputs.github-token }}

    # Keep both bootstrap inputs across runs. The pointer selects their release,
    # and either trust record may invalidate cached bytes for the same tag.
    #
    # Both checksum tables are in the key as well, so a corrected jar digest or
    # std tree hash for an unchanged tag misses rather than restores a cache the
    # resolver will immediately refuse. seedjar.sh still verifies both inputs
    # on every cache hit, not merely after a download or extraction.
    - name: cache the bootstrap seed
      uses: actions/cache@v4
      with:
        path: .dawn/seeds
        key: dawn-seed-${{ hashFiles('scripts/seed-release.txt', 'scripts/seed-checksums.txt', 'scripts/seed-std-checksums.txt') }}

    # [java-deps] resolution, so nine jobs do not each ask Maven Central for the
    # same asm jar. dawn.lock is the key because it *is* the resolved closure;
    # `dawn lock --check selfhost` still runs in java-target-classpath, so a
    # cache that somehow held a different closure fails there rather than
    # passing quietly.
    #
    # Not a speed-up, measured: this whole setup took 24-29s per job on the
    # cold run (31160611693) and 23-27s on the warm one (31161006590) -- the
    # asm jar is ~120 KB and the restore costs about what the download did.
    # It is here to take Maven Central off nine jobs' critical path, which is
    # the only claim it can support.
    - name: cache resolved java-deps
      uses: actions/cache@v4
      with:
        path: ~/.cache/coursier
        key: coursier-${{ hashFiles('selfhost/dawn.lock') }}
        restore-keys: coursier-

    # bin/dawn fetches the previous release's dawn-selfhost.jar (the bootstrap
    # seed, scripts/seed-release.txt) and rebuilds the toolchain from HEAD
    # sources -- in two stages, so the jar's runtime classes come from HEAD too
    # (see the note in bin/dawn). Every `./bin/dawn` step in gates.yml exercises
    # selfhost.
    - name: build the selfhost toolchain
      if: inputs.build == 'true'
      shell: bash
      run: ./bin/dawn --version
