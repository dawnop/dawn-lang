  tile-shards-complete:
    needs: [dedupe, tile-golden-1, tile-golden-2, tile-golden-3, tile-golden-4, tile-golden-5, tile-golden-6, tile-golden-7, tile-golden-8, tile-golden-9, tile-golden-10, tile-golden-11, tile-golden-12, tile-golden-13, tile-golden-14, tile-golden-15, tile-golden-16, tile-golden-17, tile-golden-18, tile-golden-19]
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' && inputs.experiment != 'baseline' }}
    runs-on: ubuntu-24.04
    # budget: floor (lightweight receipt and coverage union)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: coverage identities and missing work are refused
        run: python3 -B scripts/tile-prep/coverage.py selftest
      - name: the union is every successful item exactly once
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/tile-prep/coverage.py union --total 19 --job-prefix tile-golden- --out "$RUNNER_TEMP/tile-evidence"
      - name: retain receipts and successful item clocks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tile-shared-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tile-evidence
          if-no-files-found: error
          retention-days: 7

      - name: this tree's verified record
        if: ${{ success() && inputs.experiment != 'probe' }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "TILE_TREE=$tree" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tile-verified"
          printf '{"tree": "%s", "sha": "%s", "run": %s, "event": "%s", "ref": "%s"}\n' \
            "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" "$GITHUB_REF" \
            > "$RUNNER_TEMP/tile-verified/record.json"
          cat "$RUNNER_TEMP/tile-verified/record.json"

      - name: upload the verified record
        if: ${{ success() && env.TILE_TREE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TILE_VERIFIED_PREFIX }}${{ env.TILE_TREE }}
          path: ${{ runner.temp }}/tile-verified/record.json
          if-no-files-found: error
          retention-days: 90
          # a re-run attempt of the same run records the same tree again
          overwrite: true

  baseline-complete:
    needs: [dedupe, tile-before-1, tile-before-2, tile-before-3, tile-before-4, tile-before-5, tile-before-6, tile-before-7, tile-before-8, tile-before-9, tile-before-10, tile-before-11]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment == 'baseline' }}
    runs-on: ubuntu-24.04
    # budget: floor (lightweight receipt and coverage union)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: coverage identities and missing work are refused
        run: python3 -B scripts/tile-prep/coverage.py selftest
      - name: the union is every successful item exactly once
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/tile-prep/coverage.py union --total 11 --job-prefix tile-before- --baseline --plan scripts/tile-prep/baseline-plan.txt --out "$RUNNER_TEMP/tile-evidence"
      - name: retain receipts and successful item clocks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tile-before-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tile-evidence
          if-no-files-found: error
          retention-days: 7
