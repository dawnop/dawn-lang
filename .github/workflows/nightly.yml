name: nightly

# Gates worth running, but not worth running on every push.
#
# Each job below says why it is here rather than on the push path. The first
# is the ecosystem corpus of scripts/selfhost-prev-diff.sh.
# That script's `--corpus site` clones dawnop-site at a pinned commit and
# sweeps its backend-dawn sources with the previous release's toolchain and
# HEAD's, which is where the `lex backend-dawn`, `parse backend-dawn` and
# `fmt backend-dawn` labels come from. It ran on the push path until
# 2026-09-11, and there it put a third-party checkout on the path every commit
# has to pass: GitHub being unreachable, a force-push in that repository, or
# that repository turning private all read as this compiler being broken. Once
# a day is the same evidence at a small fraction of the exposure, and the
# corpus is a slow-moving pin rather than something a single commit can break
# in a way a day's delay hides (ARCH-N07, 2026-09-07).
#
# Scheduled workflows run from the default branch only, so this file is read
# from main no matter what is on other branches. `workflow_dispatch` is here so
# a person can ask for the same evidence without waiting for the hour.
#
# No `# budget:` line below, deliberately. scripts/check-gate-budgets.py reads
# every workflow that carries one, discovered rather than listed: on
# 2026-09-24 that is gates.yml and ci.yml, tile.yml and editor-grammar.yml
# behind their paths, and release.yml and verify-external.yml, which a tag or
# a maintainer runs. The budget rule exists to keep a job somebody waits on
# from being killed by a slow runner, and to cap what the every-push run may
# claim. Nothing waits on this run, so each timeout here is a runaway stop and
# not a claim about the work. (budget-observations below is where the claims
# themselves are audited.) The corpus step took 97s inside gates.yml's
# `prev-diff` job, and 15 minutes is generous on top of the toolchain setup and
# the rest of the differential the script runs anyway.
on:
  schedule:
    # 04:40 UTC. GitHub's cron is best effort and drops runs at busy times, so
    # this asks for a trough rather than an even hour.
    - cron: '40 4 * * *'
  workflow_dispatch:

jobs:
  ecosystem-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # the declared-change scan walks commits since the N-1 tag
          fetch-depth: 0

      # build: false -- the script drives the seed and builds what it needs
      # itself, so a toolchain built up front would only be built again.
      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build: 'false'

      # The whole differential, not only the three ecosystem labels: the N-1
      # comparison the corpus needs is the same one the in-repo targets use, so
      # running it twice would be the expensive way to run it once.
      - name: N vs N-1 differential, with the backend-dawn corpus
        run: ./scripts/selfhost-prev-diff.sh --corpus site

  # Ruling 9(b). check-gate-budgets.py in tree-policy holds every timeout to
  # its `# budget:` line, but whether the line is still the worst observation
  # needs the Actions API, and a push gate that reads the network goes red for
  # the network (gate-observations.py's header). So it runs here: the last
  # seven days of ci.yml on main, compared with every declared claim. On
  # 2026-09-03 twenty-one claims sat under their own worst run and every gate
  # was green; this is the check that would have said so.
  #
  # Red opens an issue (scripts/nightly-issue.sh): a scheduled run blocks
  # nothing, so a red nobody is told about is a red nobody sees. It reads the
  # API directly and no previous run's artifact, so it has no first-run case
  # and no retention window. Measured locally 2026-09-24: 1m52s to read 25
  # runs, 0.06s to compare; nothing here builds.
  #
  # 2026-09-25: the job also reports what a push to main costs, week against
  # week (scripts/gate-totals.py has the why): job-seconds per successful
  # push, span, the share of each job family and how often tile.yml fires,
  # as a table in the step summary, and an issue when the median grows more
  # than 10% on the week before or tile.yml runs on more than one push in
  # five. It reads fourteen days rather than seven, so it fetches its own
  # records instead of widening the audit's window, which would change what
  # the audit holds the claims to. That second read is the cost: measured
  # locally 2026-09-25, 6m00s for 80 ci.yml runs and 1m00s for 33 tile.yml
  # runs (the local link is slow; the audit's 25 runs took 1m52s on it), and
  # 0.04s to compute. Hence 30 minutes rather than 15, as a runaway stop.
  #
  # 2026-09-26 (issue #244): the audit holds a gates.yml claim only to runs
  # of the job's current steps, so gate-observations.py reads gates.yml at
  # every run's commit and records each job's steps digest. That is git, not
  # the API, hence the full-history checkout below (tree-policy does the same
  # on every push; its checkout step took 5s on run 36245872151) and PyYAML
  # for the parser. Measured locally: 2.0s for the 52 runs of 09-19 .. 09-26
  # (26 distinct gates.yml blobs parsed, each once); the totals step's
  # fourteen days add about as much again. Nothing here changes the timeout.
  budget-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Listed in full: a `permissions:` block sets everything it omits to none.
    permissions:
      actions: read     # the runs and their jobs, for gate-observations.py
      contents: read    # the checkout
      issues: write     # the report when the claims are wrong
    steps:
      - uses: actions/checkout@v4
        with:
          # gate-observations.py reads gates.yml at each observed run's
          # commit with git to key the run by its steps (issue #244); a
          # commit git lacks falls back to one contents API call.
          fetch-depth: 0

      # The steps digest is steps_lock.py's, read through gatesplan.py, which
      # uses PyYAML. Same line and reason as gates.yml's tree-policy step:
      # the runner image does not document python3-yaml.
      - name: PyYAML for the steps digests
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml==6.0.3

      - name: every budget claim is at least its worst observed run
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # One file for both, so the issue quotes whichever one failed.
          # --runs is a ceiling well above a week of main pushes, so the
          # seven days bound the window and not the default of 25 runs
          # (about two days on 2026-09-23).
          python3 scripts/gate-observations.py --repo "$GITHUB_REPOSITORY" \
              --since "$since" --runs 150 --out obs.json > budgets.txt 2>&1 &&
            python3 scripts/check-gate-budgets.py --observed obs.json \
              >> budgets.txt 2>&1 || status=$?
          cat budgets.txt
          exit "${status:-0}"

      - name: report under-declared budgets as an issue
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "The nightly budget audit found \`# budget:\` claims below the"
            echo "worst observed run of their job, or could not read the runs."
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Restate each line the output names (3x rule, run pole) or say"
            echo "why the observation is an outlier. Output:"
            echo
            echo '```'
            cat budgets.txt 2>/dev/null || echo "(no output was captured)"
            echo '```'
          } > issue.md
          scripts/nightly-issue.sh "nightly: gate budgets under-declared" issue.md

      # The totals are a report, so they run whether or not the audit above
      # was green. The table goes in the step summary every night; the issue
      # only when gate-totals.py exits 1.
      - name: job-seconds per push, week against week
        id: totals
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          since=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/gate-observations.py --repo "$GITHUB_REPOSITORY" \
              --since "$since" --runs 400 --out ci-weeks.json > totals.txt 2>&1 &&
            python3 scripts/gate-observations.py --repo "$GITHUB_REPOSITORY" \
              --workflow tile.yml --allow-empty --since "$since" --runs 400 \
              --out tile-weeks.json >> totals.txt 2>&1 &&
            python3 scripts/gate-totals.py --ci ci-weeks.json \
              --tile tile-weeks.json > table.md 2>> totals.txt || status=$?
          cat totals.txt
          if [ -s table.md ]; then
            cat table.md
            cat table.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${status:-0}"

      - name: report gate totals over their limits as an issue
        if: ${{ !cancelled() && steps.totals.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "The nightly gate totals report crossed a limit (median job-seconds"
            echo "per successful push up more than 10% on the week before, or"
            echo "tile.yml on more than one push in five), or could not read the runs."
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "The push total in gates.yml caps the claims; this is the measured"
            echo "side. Name the jobs that grew, or say why the week is an outlier."
            echo
            cat table.md 2>/dev/null || true
            echo
            echo '```'
            cat totals.txt 2>/dev/null || echo "(no output was captured)"
            echo '```'
          } > totals-issue.md
          scripts/nightly-issue.sh "nightly: gate totals over their limits" totals-issue.md

  # Ruling 9(c). The corpus above is dawnop-site at a pinned commit, and a pin
  # nothing advances answers an older question every week: it sat at a72bfc9
  # (v0.59.0) through three `.dawn-version` bumps over there. The rule is
  # dawnop-site's, not this repository's: the pin may not be older than
  # dawnop-site's latest commit that changed `.dawn-version`
  # (scripts/selfhost-prev-diff.sh has the reasoning and the three API
  # calls). It is its own job because it needs no toolchain and must still
  # report when the corpus job is red for an unrelated reason.
  corpus-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read    # the checkout; dawnop-site is public
      issues: write     # the report when the pin is behind
    steps:
      - uses: actions/checkout@v4

      - name: the ecosystem pin is not behind dawnop-site's last Dawn bump
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/selfhost-prev-diff.sh --check-pin > pin.txt 2>&1 || status=$?
          cat pin.txt
          exit "${status:-0}"

      - name: report a stale pin as an issue
        if: failure() && steps.pin.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "The ecosystem corpus pin (\`ECO_REV\` in"
            echo "scripts/selfhost-prev-diff.sh) is behind dawnop-site's latest"
            echo "\`.dawn-version\` change, or the check could not read dawnop-site."
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Advance \`ECO_REV\` to that commit or later and run"
            echo "\`./scripts/selfhost-prev-diff.sh --corpus site\` once. Output:"
            echo
            echo '```'
            cat pin.txt 2>/dev/null || echo "(no output was captured)"
            echo '```'
          } > issue.md
          scripts/nightly-issue.sh "nightly: ecosystem corpus pin is behind dawnop-site" issue.md
