    runs-on: ubuntu-24.04
    # budget: floor (lightweight receipt and coverage union)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: coverage identities and missing work are refused
        run: |
          python3 -B scripts/tile-prep/coverage.py selftest
          python3 -B scripts/mutant-coverage/check.py --self-test
      - name: the union is every successful item exactly once
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/tile-prep/coverage.py union --total 19 --job-prefix tile-golden- --out "$RUNNER_TEMP/tile-evidence"
      - name: this tree's verified record
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "TILE_TREE=$tree" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tile-evidence"
          printf '{"tree": "%s", "sha": "%s", "run": %s, "event": "%s", "ref": "%s"}\n' \
            "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" "$GITHUB_REF" \
            > "$RUNNER_TEMP/tile-evidence/record.json"
          cat "$RUNNER_TEMP/tile-evidence/record.json"

      - name: retain coverage evidence and the verified record
        if: ${{ success() && env.TILE_TREE != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.TILE_VERIFIED_PREFIX }}${{ env.TILE_TREE }}
          path: ${{ runner.temp }}/tile-evidence
          if-no-files-found: error
          retention-days: 90
          # a re-run attempt of the same run records the same tree again
          overwrite: true
