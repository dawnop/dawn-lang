name: tile

# packages/tileir's Tile IR against the two records that can say it is wrong:
# the text and bytecode goldens beside scripts/tile-golden/run.sh (layer 0 of
# docs/tile-backend-design.md 6.2: both backends, byte for byte, plus the
# handler's determinism) and NVIDIA's `tileiras` assembling each bytecode
# golden for sm_86 (layer 1: the one verdict from outside this repository,
# with a reader and a verifier behind it that name the offset and the
# operation when they refuse), and every cubin carrying a GLOBAL FUNC named
# after its kernel. Layer 1's verdict is the exit code AND an empty error
# stream: knife 7b measured tileiras writing a cubin, exiting 0 and printing a
# refusal (an f64 `tanh` with a rounding mode it does not accept), which a
# gate reading only the status would have called green.
#
# WHAT LEFT THE PUSH PATH ON 2026-09-11, said plainly because it is a coverage
# loss and not a rearrangement: sixty-seven mutants and the two-backend byte
# comparison of 184 kernels no longer run on a push that touches none of the
# paths below. They run on the next daily schedule instead. A push that does
# touch those paths still runs all of it before the change can land.
#
# Why it was worth it: eleven shards were 5338 job-seconds of run 34484938024,
# 22.8% of every push, on a run whose span is set by its total (gates.yml's
# header has that arithmetic). Over the thirty main pushes before the move,
# the paths below were touched on none of them.
#
# What the trigger cannot see, and this is the honest cost rather than zero:
# scripts/tile-golden/run.sh:20-24 renders every kernel on BOTH backends and
# compares the bytes, so a change to the compiler's emit side can turn this
# red without touching anything tile-shaped. scripts/gate-map/gatemap.py does
# not model that coupling and returns no tile-golden row for
# selfhost/src/c/emitc.dawn. So the trigger names selfhost/src/c/** and
# selfhost/src/ir/** by hand: they are the emit side, they were touched on 0
# of those same thirty pushes, and naming them costs nothing until the day it
# matters. Everything else gatemap does couple to tile-golden is named too
# (runtime/c, std/bytes.dawn, std/gpu.dawn, std/narrow.dawn, scripts/narrow-contract,
# scripts/mutant-coverage, selfhost/src/driver, selfhost/src/main.dawn,
# bin/dawn); the list below is a superset of what gatemap knows, never a
# subset.
#
# The daily run is the backstop for everything the list still misses. A
# schedule runs from the default branch only, so this file is read from main
# whatever is on other branches, and `workflow_dispatch` is here so a person
# can ask for the same evidence without waiting for the hour.
#
# The budget lines below are under gates.yml's `# run-pole:`, the same as the
# jobs that stayed. scripts/check-gate-budgets.py reads every workflow that
# carries a `# budget:` line and holds all of them to that one pole; its
# header says why.
#
# The path total is the push total's twin for this file (gates.yml has the
# rule): the `3x` claims below may not add up past it, it was set on
# 2026-09-25 at their sum, and raising it takes a
# `Gate-Budget(path-total): <old>s -> <new>s <why>` line in the commit
# message. It is its own line and not part of the push total because this
# file runs only on the pushes that touch the paths below. How often that is
# drifts on its own (none of the thirty pushes before the move, 19 of the 80
# main pushes from 09-12 to 09-24), so the nightly budget report in
# nightly.yml counts it, and says so when it passes one push in five.
#
# ON A PUSH, A TREE ALREADY VERIFIED IS NOT RUN AGAIN (2026-09-30). The
# `dedupe` job below asks scripts/tile-verified.py whether this commit's git
# tree (`git rev-parse HEAD^{tree}`) already has a green run of this
# workflow, recorded as an artifact named `tile-verified-v1-<tree>` that
# tile-shards-complete uploads once all seven shards and the union check are
# green (kept 90 days). If it has, the seven shards and tile-shards-complete
# are skipped and the step summary names the run that verified it. Only a
# push is deduplicated: pull_request, schedule and workflow_dispatch always
# run every shard, so the whole set runs on the pull request and every day,
# and the schedule stays the backstop for drift the tree cannot see.
#
# Why the tree and not the paths or a digest. In the week of 09-22 .. 09-29
# this file fired on 19 of 57 pushes to main, and 17 of those 19 ran on a
# tree a pull_request run had verified green about half an hour before: a
# rebase merge changes the SHA and not the tree. None of the 19 changed a
# tile golden. Narrowing the paths removes at most 6 of the 19 and drops the
# driver coupling named above. A digest of the toolchain jar changed on 31
# of the 57 pushes, more often than the paths fire. A digest of the tile
# inputs alone leaves out the compiler, which is the emit-side coupling this
# header exists to name. The tree carries the compiler, the goldens, this
# file, the tileiras pin and .github/actions at once. Replayed on that week,
# the push re-runs drop from 19 to 2 (about 82,000 job-seconds a week).
# scripts/tile-verified.py has the rules a record must meet (made in this
# repository, by a run whose head repository is this one too, of this file,
# concluded success, not expired) and the measurements behind this paragraph.
#
# A push can also be merged before its pull request's run has finished, and
# then asks for a record that does not exist yet: on 09-30 .. 10-01 four of
# the eight pushes that still ran the shards were that race, the record
# arriving 5.5 to 9.5 minutes after the push asked. So when no record counts,
# dedupe finds the merged pull request (`commits/<sha>/pulls`), waits up to
# 15 minutes for its tile run still in progress, and asks again. Replayed on
# those days, the eight drop to four; the other four are pushes whose tree no
# run ever verified (main moved under the pull request), and they still run.
#
# The `v1-` in the name is an environment version, not a format version:
# the tree cannot see the runner image or a floating `@v4` tag. When one of
# those moves in a way that could change a verdict (ubuntu-latest becomes
# Ubuntu 26 from 2026-10-19), change TILE_VERIFIED_PREFIX below by hand and
# every tree runs again. Not actions/cache: a cache saved on a pull request
# belongs to its merge ref, which main cannot read.
#
# nightly.yml's totals report counts a tile trigger only when the
# shards all ran green, so a deduplicated push is not counted as one.
#
# path-total: 7069s (the most this file's `3x` claims may add up to)
on:
  push:
    branches: [main]
    # The two lists are written out twice rather than shared with a YAML
    # anchor: GitHub's workflow parser does not resolve aliases. Keep them
    # identical.
    paths:
      - 'packages/tileir/**'
      - 'packages/tileref/**'
      - 'scripts/tile-golden/**'
      - 'scripts/tile-gpu-diff/**'
      - 'scripts/leetgpu-diff/**'
      - 'scripts/narrow-contract/**'
      - 'scripts/mutant-coverage/**'
      - 'std/bytes.dawn'
      - 'std/gpu.dawn'
      - 'std/narrow.dawn'
      - 'runtime/c/**'
      - 'selfhost/src/c/**'
      - 'selfhost/src/ir/**'
      - 'selfhost/src/driver/**'
      - 'selfhost/src/main.dawn'
      - 'bin/dawn'
      - '.github/workflows/tile.yml'
      - '.github/actions/**'
      # Documentation is not a tile input: no build, golden or device program
      # reads a .md file, and scripts/tile-gpu-diff/inputs.py leaves them out
      # of the ledger digest for the same reason. A README-only change ran
      # all seven shards once in the week of 09-26 (PR #384).
      - '!packages/tileir/**/*.md'
      - '!packages/tileref/**/*.md'
  pull_request:
    paths:
      - 'packages/tileir/**'
      - 'packages/tileref/**'
      - 'scripts/tile-golden/**'
      - 'scripts/tile-gpu-diff/**'
      - 'scripts/leetgpu-diff/**'
      - 'scripts/narrow-contract/**'
      - 'scripts/mutant-coverage/**'
      - 'std/bytes.dawn'
      - 'std/gpu.dawn'
      - 'std/narrow.dawn'
      - 'runtime/c/**'
      - 'selfhost/src/c/**'
      - 'selfhost/src/ir/**'
      - 'selfhost/src/driver/**'
      - 'selfhost/src/main.dawn'
      - 'bin/dawn'
      - '.github/workflows/tile.yml'
      - '.github/actions/**'
      # Documentation is not a tile input: no build, golden or device program
      # reads a .md file, and scripts/tile-gpu-diff/inputs.py leaves them out
      # of the ledger digest for the same reason. A README-only change ran
      # all seven shards once in the week of 09-26 (PR #384).
      - '!packages/tileir/**/*.md'
      - '!packages/tileref/**/*.md'
  schedule:
    # 05:20 UTC, twenty minutes behind nightly.yml so the two do not contend
    # for runners. GitHub's cron is best effort and drops runs at busy times,
    # which is a reason to ask for a trough and a reason not to treat a missed
    # night as a verdict.
    - cron: '20 5 * * *'
  workflow_dispatch:

concurrency:
  group: tile-${{ github.ref }}
  cancel-in-progress: true

env:
  # The environment version of the verified-tree record; the header says
  # when to change it.
  TILE_VERIFIED_PREFIX: tile-verified-v1-

jobs:
  # SEVEN round-robin shards of one matrix (scripts/tile-golden/matrix.txt: the
  # 192 kernels, then the 77 mutants, in run order), eleven until 2026-09-11
  # and six until knife T17 (2026-10-02; its paragraph below has why).
  # Sharding by kind was the plan written down at knife 7b and the phase
  # measurement retired it: neither half dominates, the kernel half grows
  # faster (~8s per new kernel against ~21s per new mutant), and a split by
  # kind would have left one job carrying it. Every Nth item of the mixed list
  # divides both at once and spreads the outliers with them (`reverse` alone
  # costs five average kernels).
  #
  # Why six rather than eleven. Eleven was reached by nine successive splits,
  # every one of them forced by the 660s pole and argued as budget headroom
  # rather than wall clock. This workflow is not queue-bound the way gates.yml
  # is: six jobs against a ceiling of 20 all start at once, so here the span
  # really is the longest job, and eleven shards bought nothing but eleven
  # copies of a ~41s setup. Six is the fewest that keeps a shard under the
  # 950s pole.
  #
  # The arithmetic, from the 25 completed main runs of 09-08T00:18Z ..
  # 09-10T13:48Z (the 2026-09-10 CI audit's obs.json). The eleven shards'
  # worst observations are 552 / 496 / 555 / 503 / 529 / 501 / 494 / 515 /
  # 522 / 522 / 495s, which is 5684s; the setup that eleven shards paid
  # eleven times is 448 job-seconds of run 34484938024, or 41s each, so the
  # items are 5684 - 11 * 41 = 5233s of work. Six round-robin shards divide
  # that evenly by construction: 873s each, plus the one 41s setup a shard
  # still pays, is 914s.
  #
  # That is a ceiling twice over -- a sum of worst cases from runs that were
  # not the same run -- and it is 36s under the pole. If a real six-way shard
  # observes past 914s, the restatement collides with the pole and the answer
  # is a seventh shard, not a taller pole. Seven would be 748 + 41 = 789s.
  #
  # Knife U2 (2026-10-02) added four tile-golden mutants. One full local run
  # measured them at 24.1-24.3s each against a 24.1s mean over the other 67,
  # so they are ordinary mutants; at the ~21s a mutant costs here that is
  # 84s of work, 14s a shard, and the planning value is restated from 914s
  # to 928s, still 22s under the pole. The timeout follows the 3x rule
  # (2784s, 47 minutes).
  #
  # Knife T16 (2026-10-02) added two kernels and four mutants. One full
  # local run (262 items, 3134s wall) measured the kernels at 6.95 and
  # 6.63s against a 6.50s mean over the other 185 and the mutants at 24.5
  # to 25.2s against a 25.3s mean over the other 71, so all six are
  # ordinary items. At the ~8s a kernel and ~21s a mutant cost here that is
  # 100s of work, 17s a shard rounded up, and the planning value is
  # restated from 928s to 945s, 5s under the pole. The next knife that adds
  # this much is the seventh shard (the arithmetic above). The timeout
  # follows the 3x rule (2835s, 48 minutes).
  #
  # Knife T17 (2026-10-02) added four kernels and two mutants and is that
  # knife, so the matrix is dealt SEVEN ways. The work, item by item, at the
  # ~8s a kernel and ~21s a mutant this file has always charged: 5233s
  # measured over the eleven shards, plus U2's 84s and T16's 100s, plus T17's
  # 4 x 8 + 2 x 21 = 74s, is 5491s. Seven ways that is 784.4s, 785s rounded
  # up, plus the one 41s setup every shard still pays: 826s a shard, 124s
  # under the pole where six shards had 5s. The path total moves by the
  # seventh setup and T17's work and nothing else: 7 x 826 - 6 x 945 = 112s
  # (74s of items, 41s of setup, 3s less rounding), 6580s -> 6692s with the
  # dedupe job's 910s unchanged. A full local run measured the four kernels
  # and the two mutants as ordinary items (the knife's commit message has the
  # numbers). The timeout follows the 3x rule (2478s, 42 minutes).
  #
  # flash_attn (2026-10-03) is one more kernel and no mutant: 8s of items,
  # 5499s in all, 785.6s a shard and 786s rounded up, so 827s a shard. The
  # path total moves by seven times that one second, 6692s -> 6699s; the
  # timeout is unchanged (2481s is still 42 minutes).
  #
  # THE COST MODEL ABOVE IS OUT OF DATE, and knife C (2026-10-03) says by
  # how much. Read off shard logs of 09-26 .. 10-03, a kernel costs 6.5 to
  # 11s (the fast and the slow runner, about 1.5x apart), a mutant at -O2
  # 27 to 39s on the fast runner and 40 to 52s on the slow one, growing
  # about a quarter in that week as packages/tileir and packages/tileref
  # grew, and the fixed part of a shard is about 80s, not 41s: the toolchain
  # and the wheels about 45s plus one -O2 clean build and the JVM's first
  # start, 25 to 48s. The seven shards observed 798 to 954s at the median
  # and up to 1076s, against the 827s claimed. The mutant's cost was its
  # whole-program cc, so run.sh now builds mutants at -O0 (the clean build
  # and every golden stay -O2): one local tree, all 77 mutants, 33.6s a
  # mutant at -O2 and 16.7s at -O0, the mutant stage 2617s and 1316s, and
  # every mutant observing the same exit codes, outputs, bytecode and
  # tileiras logs file for file at both (run.sh's mutant_project has the
  # rest). Scaled to CI that is about 19s a mutant on the fast runner and
  # 25s on the slow one, eleven mutants a shard, so a shard should come down
  # by about 210 to 275s: the worst observation 1076s to about 800s. That is
  # a projection. The claims below stay at 827s until three main runs have
  # been observed at -O0, and are then restated from those observations.
  #
  # They were, on 2026-10-05. The nightly audit (issue #274, run
  # 37305388132) read tile.yml's seven days to 10-05T11:35Z and found every
  # shard past its 827s claim, 1026 to 1060s, all on runs from before
  # 55eedb54 reached main. Read again for the -O0 runs alone (19 main runs,
  # 8a4c6c85 / run 37153044998 .. 611dd421 / run 37303939729), each shard's
  # worst is 884 / 892 / 906 / 861 / 855 / 867 / 894s, and the median
  # shard of the last four runs is 540 to 750s. Worst against worst, -O0
  # took 120 to 199s off a shard, under the projected 210 to 275s.
  #
  # Each claim is now its own shard's worst at -O0, held at the observation
  # rather than a tenth over it: a tenth over 867s or more crosses the 950s
  # pole, five of the seven are there, and the seven are one matrix dealt
  # round robin, so they are held alike. Restating to the -O2 runs would put
  # all seven past the pole. That leaves two things said plainly. The nightly
  # audit still reads the -O2 runs until its window rolls past 55eedb54 (the
  # 10-11 nightly), and reports them; a claim may not follow them over the
  # pole, so those reports are expected and not a restatement to make. And a
  # shard has 44 to 95s left under the pole, so the next knife that adds
  # items, or the next slow runner past those figures, is the eighth shard
  # (906s less an 80s fixed part, seven ways dealt eight, is about 805s), not
  # a taller pole. The path total moves from 6699s to the new claims' sum plus
  # dedupe's 910s, 7069s.
  #
  # The split cannot reach the verdicts. A kernel's four runs, its two goldens
  # and its assembly all happen inside one shard, and each mutant compares
  # against the recorded goldens on disk rather than against its own shard's
  # kernel output, so the named red sets survive being dealt into seven jobs.
  # What sharding does introduce is the shard family's one failure: a shard
  # that silently skips a slice prints the same PASS lines and exits 0. So
  # each records what it ran, and tile-shards-complete below holds the union
  # to matrix.txt.
  #
  # tileiras is an offline assembler: no GPU, no driver, it links libc, libm
  # and libpthread only and reads libnvvm.so.4 and execs ptxas from two
  # sibling wheels. install-tileiras.sh downloads the three wheels
  # scripts/tile-golden/toolchain.txt pins by exact version and refuses any
  # whose sha256 differs (a checksum from the same place as the file is not a
  # check); the pin and the bytecode version the writer emits are held
  # together by run.sh. The wheels are 150 MB and nothing outside this file
  # needs them, which is a second reason these are jobs of their own.

  # The push-only duplicate check; the header has the reasoning and
  # scripts/tile-verified.py the rules. No toolchain: a checkout, the lookup's
  # self-test and two Actions API reads. A failed lookup is `skip=false`, and
  # the shards' `if:` also runs them when this job did not finish, so the one
  # way to skip is a record that passed every rule.
  dedupe:
    runs-on: ubuntu-latest
    # Listed in full: a `permissions:` block sets everything it omits to none.
    permissions:
      actions: read        # the artifact listing, the run that made it, the pull request's run
      contents: read       # the checkout
      pull-requests: read  # commits/<sha>/pulls, the pull request a push merged
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
    # Seconds when a record exists or no pull request run is in progress (7
    # to 9 s observed). Waiting is what it costs otherwise: the four races of
    # 09-30 .. 10-01 replay to 210, 330, 480 and 570 s of waiting plus the
    # job's own 9 s. The claim is the worst case, not those: the script
    # stops waiting at 900 s, and 900 s plus the job's 7 to 9 s, rounded up
    # to 5 s, is 910 s, under the 950 s run pole.
    # budget: 3x 910s the 900s wait cap plus the job itself
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4
      - name: the verified-tree lookup refuses what it should
        run: python3 scripts/tile-verified.py --self-test
      - name: has this tree already passed tile.yml?
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/tile-verified.py lookup --repo "$GITHUB_REPOSITORY" \
            --repo-id "$GITHUB_REPOSITORY_ID" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --prefix "$TILE_VERIFIED_PREFIX" --event "$GITHUB_EVENT_NAME" \
            --sha "$GITHUB_SHA"

  tile-golden-1:
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # 786s of items (5499 / 7) plus one 41s setup; the note above has the
    # arithmetic. Shard 1 also carries the two ledger gates and the wheel
    # cache contract, which are sub-second between them.
    # 2026-10-05, restated from the -O0 runs (the note above, last
    # paragraph of the cost model).
    # budget: 3x 884s worst observed at -O0, held at the observation (run 37223252757)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # shard 1 alone reads git: the GPU diff ledger's ancestry test needs
          # the history. The other five do not, and are not deepened.
          fetch-depth: 0

      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: restore the pinned tileiras wheels
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tileiras-wheels
          key: tileiras-wheels-v1-${{ runner.os }}-${{ hashFiles('scripts/tile-golden/toolchain.txt') }}

      - name: the pinned tileiras
        run: |
          bin="$(./scripts/tile-golden/install-tileiras.sh "$RUNNER_TEMP/tileiras" "$RUNNER_TEMP/tileiras-wheels")"
          "$bin" --version
          echo "TILEIRAS=$bin" >>"$GITHUB_ENV"

      - name: tileiras wheel cache refuses altered pins and bytes
        run: python3 scripts/tile-golden/install-contract.py

      - name: tile IR goldens and tileiras (191 kernels and seventy-seven mutants, both backends; shard 1 of 7)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/tile-golden/run.sh --shard 1/7

      - name: record which items this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-tile-golden-1
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

      # Two steps that are shard 1's alone, both well under a second and
      # neither shardable.
      #
      # Layer 2's ledger gate (docs 6.4, decision D4): tile-gpu-diff/run.sh
      # --check reads the last line of scripts/tile-gpu-diff/ledger.txt and
      # requires its commit to be an ancestor of HEAD with no tile path
      # changed since, its result pass or blocked, and toolchain.txt's driver
      # line to agree. The GPU run itself happens on a developer machine with
      # a driver (the runner has none); the gate proves it happened at this
      # tree.
      - name: GPU diff ledger is current (layer 2 ran at this tree)
        run: ./scripts/tile-gpu-diff/run.sh --check

      # No GPU: the fold that makes the ledger's one verdict reads every
      # family in run.sh's list, with its negative control (#575).
      - name: the layer 2 verdict fold reads every family
        run: bash scripts/tile-gpu-diff/fold_verdict.sh --selftest

      - name: the leetgpu ledger (a listed problem has a kernel and a device run)
        run: |
          python3 scripts/leetgpu-diff/check.py
          python3 scripts/leetgpu-diff/check.py --self-test

  tile-golden-2:
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # 786s of items (5499 / 7) plus one 41s setup; see shard 1's note.
    # 2026-10-05, restated from the -O0 runs (the note above, last
    # paragraph of the cost model).
    # budget: 3x 892s worst observed at -O0, held at the observation (run 37211185610)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: restore the pinned tileiras wheels
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tileiras-wheels
          key: tileiras-wheels-v1-${{ runner.os }}-${{ hashFiles('scripts/tile-golden/toolchain.txt') }}

      - name: the pinned tileiras
        run: |
          bin="$(./scripts/tile-golden/install-tileiras.sh "$RUNNER_TEMP/tileiras" "$RUNNER_TEMP/tileiras-wheels")"
          "$bin" --version
          echo "TILEIRAS=$bin" >>"$GITHUB_ENV"

      - name: tile IR goldens and tileiras (191 kernels and seventy-seven mutants, both backends; shard 2 of 7)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/tile-golden/run.sh --shard 2/7

      - name: record which items this shard ran
        uses: actions/upload-artifact@v4
        with:
          name: mutant-coverage-tile-golden-2
          path: ${{ runner.temp }}/mutant-coverage
          if-no-files-found: error
          retention-days: 1

  tile-golden-3:
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # 786s of items (5499 / 7) plus one 41s setup; see shard 1's note.
    # 2026-10-05, restated from the -O0 runs (the note above, last
    # paragraph of the cost model).
    # budget: 3x 906s worst observed at -O0, held at the observation (run 37223252757)
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/dawn-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: restore the pinned tileiras wheels
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tileiras-wheels
          key: tileiras-wheels-v1-${{ runner.os }}-${{ hashFiles('scripts/tile-golden/toolchain.txt') }}

      - name: the pinned tileiras
        run: |
          bin="$(./scripts/tile-golden/install-tileiras.sh "$RUNNER_TEMP/tileiras" "$RUNNER_TEMP/tileiras-wheels")"
          "$bin" --version
          echo "TILEIRAS=$bin" >>"$GITHUB_ENV"

      - name: tile IR goldens and tileiras (191 kernels and seventy-seven mutants, both backends; shard 3 of 7)
        env:
          MUTANT_COVERAGE_DIR: ${{ runner.temp }}/mutant-coverage
        run: ./scripts/tile-golden/run.sh --shard 3/7

      - name: record which items this shard ran
