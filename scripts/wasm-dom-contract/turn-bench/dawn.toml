schema = 1
# Not a package and not an example: the guest half of turn-bench.mjs, the
# instrument that prices one reactor turn stage by stage. It is a fixture
# under scripts/ for the reason ../collect is: discovery gates look under
# packages/ and examples/, so nothing builds or tests it by accident.
name = "tea_dom_turn_bench"
version = "0.0.0"

[deps]
tea_core = "../../../packages/tea-core"
tea_dom = "../../../packages/tea-dom"
json = "../../../packages/json"
